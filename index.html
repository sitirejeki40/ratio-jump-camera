================================================== */

<script>


/* ==================================================

================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxoP3_605xuQQb3Rb0uwGPDNLHBq6Xdju3TYYIzom_XovINiPxofhUTeEF20_K8mDFb/exec";


const PARENT_ORIGIN =
"https://sitirejeki40.github.io";


/* ==================================================
   DATA GAME
================================================== */

let questions = [];

let currentIndex = 0;

let score = 0;

let selectedAnswer = null;

let revealed = false;

let timerInterval = null;

let countdownInterval = null;

let bridgeFrame = null;

let cameraReady = false;

let bgmOn = true;


/* ==================================================
   AUDIO
================================================== */

let audioCtx = null;

let masterGain = null;

let bgmTimer = null;

let bgmStep = 0;


/* ==================================================
   INIT AUDIO
================================================== */

function initAudio() {

  if (audioCtx) {

    if (
      audioCtx.state === "suspended"
    ) {

      audioCtx.resume();

    }

    return;

  }


  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) {

    return;

  }


  audioCtx =
    new AudioContext();


  masterGain =
    audioCtx.createGain();


  masterGain.gain.value =
    0.16;


  masterGain.connect(
    audioCtx.destination
  );

}


/* ==================================================
   SOUND TONE
================================================== */

function soundTone(
  frequency,
  duration,
  volume,
  type
) {

  if (
    !audioCtx ||
    !masterGain
  ) {

    return;

  }


  const osc =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  osc.type =
    type || "sine";


  osc.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    0.001,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    volume || 0.05,
    audioCtx.currentTime + 0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + duration
  );


  osc.connect(gain);

  gain.connect(
    masterGain
  );


  osc.start();

  osc.stop(
    audioCtx.currentTime +
    duration +
    0.03
  );

}


/* ==================================================
   BGM
================================================== */

function startBGM() {

  if (!bgmOn) {

    return;

  }


  initAudio();


  if (!audioCtx) {

    return;

  }


  if (bgmTimer) {

    return;

  }


  const melody = [

    523.25,
    659.25,
    783.99,
    659.25,

    587.33,
    698.46,
    880.00,
    698.46

  ];


  const bass = [

    130.81,
    130.81,
    146.83,
    146.83,

    174.61,
    174.61,
    155.56,
    155.56

  ];


  bgmStep = 0;


  function playStep() {

    const note =
      melody[
        bgmStep %
        melody.length
      ];


    const bassNote =
      bass[
        bgmStep %
        bass.length
      ];


    soundTone(
      note,
      0.35,
      0.035,
      "sine"
    );


    if (
      bgmStep % 2 === 0
    ) {

      soundTone(
        bassNote,
        0.4,
        0.022,
        "triangle"
      );

    }


    bgmStep++;

  }


  playStep();


  bgmTimer =
    setInterval(
      playStep,
      470
    );

}


/* ==================================================
   STOP BGM
================================================== */

function stopBGM() {

  if (bgmTimer) {

    clearInterval(
      bgmTimer
    );

    bgmTimer = null;

  }

}


/* ==================================================
   YEAY
================================================== */

function playYeay() {

  initAudio();


  // Ucapan YEAY
  if (
    "speechSynthesis"
    in window
  ) {

    const speech =
      new SpeechSynthesisUtterance(
        "Yeay!"
      );


    speech.lang =
      "en-US";

    speech.rate =
      1.15;

    speech.pitch =
      1.4;

    speech.volume =
      1;


    speechSynthesis.cancel();

    speechSynthesis.speak(
      speech
    );

  }


  // Nada kemenangan
  const notes = [

    523.25,
    659.25,
    783.99,
    1046.50

  ];


  notes.forEach(
    function(
      note,
      index
    ) {

      setTimeout(
        function() {

          soundTone(
            note,
            0.2,
            0.10,
            "triangle"
          );

        },
        index * 120
      );

    }
  );

}


/* ==================================================
   BOOM
================================================== */

function playBoom() {

  initAudio();


  if (!audioCtx) {

    return;

  }


  const osc =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  osc.type =
    "sawtooth";


  osc.frequency.setValueAtTime(
    150,
    audioCtx.currentTime
  );


  osc.frequency.exponentialRampToValueAtTime(
    35,
    audioCtx.currentTime + 0.5
  );


  gain.gain.setValueAtTime(
    0.001,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.35,
    audioCtx.currentTime + 0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + 0.5
  );


  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  osc.start();

  osc.stop(
    audioCtx.currentTime +
    0.55
  );

}


/* ==================================================
   KAMERA
================================================== */

const video =
document.getElementById(
  "video"
);

const cameraBtn =
document.getElementById(
  "cameraBtn"
);

const cameraStatus =
document.getElementById(
  "cameraStatus"
);


cameraBtn.addEventListener(
  "click",
  async function() {

    initAudio();


    try {

      const stream =
        await navigator

            video: true,

            audio: false

          });


      video.srcObject =
        stream;


      cameraReady =
        true;


      cameraStatus.innerHTML =
        "🟢 KAMERA LIVE";


      cameraBtn.innerText =
        "✅ KAMERA AKTIF";


      cameraBtn.disabled =
        true;


      // Setelah kamera aktif,

      if (
        questions.length > 0 &&
        !revealed
      ) {

        showQuestion();

const choiceA =
document.getElementById(
  "choiceA"
);

const choiceB =
document.getElementById(
  "choiceB"
);

const revealBtn =
document.getElementById(
  "revealBtn"
);

const nextBtn =
document.getElementById(
  "nextBtn"
);

const restartBtn =
document.getElementById(
  "restartBtn"
);

const countdown =
document.getElementById(
  "countdown"
);

const countNumber =
document.getElementById(
  "countNumber"
);

const finish =
document.getElementById(
  "finish"
);

const finalScore =
document.getElementById(
  "finalScore"
);

const finalMessage =
document.getElementById(
  "finalMessage"
);

const playAgain =
document.getElementById(
  "playAgain"
);


/* ==================================================
   BUAT BRIDGE
================================================== */

function createBridge() {

  if (bridgeFrame) {

    return;

  }


  bridgeFrame =
    document.createElement(
      "iframe"
    );


  bridgeFrame.style.position =
    "fixed";

  bridgeFrame.style.width =
    "1px";

  bridgeFrame.style.height =
    "1px";

  bridgeFrame.style.border =
    "0";

  bridgeFrame.style.opacity =
    "0";

  bridgeFrame.style.left =
    "-100px";

  bridgeFrame.style.top =
    "-100px";

  bridgeFrame.style.pointerEvents =
    "none";


  bridgeFrame.src =
    API_URL +
    "?bridge=1";


  document.body.appendChild(
    bridgeFrame
  );

}


/* ==================================================
   TERIMA DATA DARI APPS SCRIPT
================================================== */

window.addEventListener(
  "message",
  function(event) {

    const data =
      event.data;


    if (
      !data ||
      data.source !==
      "ratio-jump-bridge"
    ) {

      return;

    }


    /* SOAL */

    if (
      data.type ===
      "questions"
    ) {

      questions =
        Array.isArray(
          data.data
        )
        ? data.data
        : [];


      if (
        questions.length === 0
      ) {

        questionEl.innerText =
          "❌ Bank soal kosong.";

        return;

      }


      questions.sort(
        function() {

          return (
            Math.random() -
            0.5
          );

        }
      );


      totalEl.innerText =
        questions.length;


      questionEl.innerText =
        questions[0].soal;


      feedbackEl.innerHTML =
        cameraReady

          ? "Bersiap! 🏃"

          : "🎥 Aktifkan kamera untuk memulai.";

    }


    /* ERROR */

    if (
      data.type ===
      "error"
    ) {

      questionEl.innerHTML =
        "❌ Gagal mengambil soal.<br><br>" +
        data.message;

    }

  }
);


/* ==================================================
   LOAD QUESTIONS
================================================== */

function loadQuestions() {

  questionEl.innerText =
    "⏳ Mengambil soal...";


  createBridge();

}


/* ==================================================
   SHOW QUESTION
================================================== */

function showQuestion() {

  clearInterval(
    timerInterval
  );

  clearInterval(
    countdownInterval
  );


  selectedAnswer =
    null;


  revealed =
    false;


  const q =
    questions[currentIndex];


  if (!q) {

    return;

  }


  numberEl.innerText =
    currentIndex + 1;


  questionEl.innerText =
    q.soal;


  timerEl.innerText =
    "-";


  progressEl.style.width =
    "100%";


  feedbackEl.innerHTML =
    "Baca soal dan bersiap... 🏃";


  choiceA.className =
    "choice choice-a";


  choiceB.className =
    "choice choice-b";


  revealBtn.disabled =
    true;


  revealBtn.style.display =
    "inline-block";


  nextBtn.style.display =
    "none";


  mulaiCountdown();

}


/* ==================================================
   COUNTDOWN
================================================== */

function mulaiCountdown() {

  countdown.style.display =
    "flex";


  let n =
    3;


  countNumber.innerText =
    n;


  countdownInterval =
    setInterval(
      function() {

        n--;


        if (
          n > 0
        ) {

          countNumber.innerText =
            n;

        }

        else {

          clearInterval(
            countdownInterval
          );


          countNumber.innerText =
            "JUMP!";


          setTimeout(
            function() {

              countdown.style.display =
                "none";


              mulaiTimer();

            },
            700
          );

        }

      },
      700
    );

}


/* ==================================================
   TIMER
================================================== */

function mulaiTimer() {

  let time =
    5;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  startBGM();


  timerInterval =
    setInterval(
      function() {

        time -=
          0.1;


        timerEl.innerText =
          Math.max(
            0,
            Math.ceil(time)
          );


        progressEl.style.width =
          Math.max(
            0,
            (time / 5) * 100
          ) + "%";


        if (
          time <= 0
        ) {

          clearInterval(
            timerInterval
          );


          stopBGM();


          timerEl.innerText =
            "⏰ WAKTU HABIS";


          progressEl.style.width =
            "0%";


          revealBtn.disabled =
            false;


          feedbackEl.innerHTML =
            "🏃 <b>WAKTU HABIS!</b><br>" +
            "Klik A atau B sesuai pilihan siswa.";

        }

      },
      100
    );

}


/* ==================================================
   PILIH A
================================================== */

choiceA.addEventListener(
  "click",
  function() {

    if (
      revealed ||
      revealBtn.disabled
    ) {

      return;

    }


    selectedAnswer =
      "SENILAI";


    choiceA.classList.add(
      "selected"
    );


    choiceB.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅰️ Pilihan siswa: <b>SENILAI</b><br>" +
      "Klik LIHAT JAWABAN.";

  }
);


/* ==================================================
   PILIH B
================================================== */

choiceB.addEventListener(
  "click",
  function() {

    if (
      revealed ||
      revealBtn.disabled
    ) {

      return;

    }


    selectedAnswer =
      "BERBALIK NILAI";


    choiceB.classList.add(
      "selected"
    );


    choiceA.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅱️ Pilihan siswa: <b>BERBALIK NILAI</b><br>" +
      "Klik LIHAT JAWABAN.";

  }
);


/* ==================================================
   LIHAT JAWABAN
================================================== */

revealBtn.addEventListener(
  "click",
  function() {

    if (
      revealed
    ) {

      return;

    }


    if (
      !selectedAnswer
    ) {

      feedbackEl.innerHTML =
        "⚠️ Pilih A atau B sesuai posisi siswa.";

      return;

    }


    clearInterval(
      timerInterval
    );


    stopBGM();


    revealed =
      true;


    const q =
      questions[currentIndex];


    const benar =
      selectedAnswer ===
      q.jawaban;


    /* ====================================
       BENAR
    ==================================== */

    if (benar) {

      score +=
        Number(q.poin) ||
        10;


      scoreEl.innerText =
        score;


      playYeay();


      if (
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "correct"
        );

        choiceB.classList.add(
          "dim"
        );

      }

      else {

        choiceB.classList.add(
          "correct"
        );

        choiceA.classList.add(
          "dim"
        );

      }


      feedbackEl.innerHTML =
        "🎉 <b>BENAR!</b><br>" +
        "+" +
        (Number(q.poin) || 10) +
        " POIN<br><br>" +
        q.pembahasan;

    }


    /* ====================================
       SALAH
    ==================================== */

    else {

      playBoom();


      if (
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "wrong"
        );

        choiceB.classList.add(
          "correct"
        );

      }

      else {

        choiceB.classList.add(
          "wrong"
        );

        choiceA.classList.add(
          "correct"
        );

      }


      feedbackEl.innerHTML =
        "💥 <b>BOOM!</b><br>" +
        "Jawaban benar: <b>" +
        q.jawaban +
        "</b><br><br>" +
        q.pembahasan;

    }


    revealBtn.style.display =
      "none";


    nextBtn.style.display =
      "inline-block";


    saveResult(
      q,
      selectedAnswer,
      benar
    );

  }
);


/* ==================================================
   SIMPAN HASIL
================================================== */

function saveResult(
  q,
  answer,
  benar
) {

  if (
    !bridgeFrame ||
    !bridgeFrame.contentWindow
  ) {

    console.warn(
      "Bridge belum tersedia."
    );

    return;

  }


  bridgeFrame.contentWindow.postMessage(

    {
      source:
        "ratio-jump-game",

      type:
        "save",

      payload: {

        pemain:
          "Kelas VII",

        id:
          q.id,

        jawaban:
          answer,

        jawabanBenar:
          q.jawaban,

        status:
          benar
            ? "BENAR"
            : "SALAH",

        skor:
          benar
            ? Number(q.poin) || 10
            : 0

      }

    },

    "*"

  );

}


/* ==================================================
   NEXT
================================================== */

nextBtn.addEventListener(
  "click",
  function() {

    currentIndex++;


    if (
      currentIndex >=
      questions.length
    ) {

      finishGame();

      return;

    }


    // kembali normal
    choiceA.className =
      "choice choice-a";


    choiceB.className =
      "choice choice-b";


    showQuestion();

  }
);


/* ==================================================
   FINISH
================================================== */

function finishGame() {

  stopBGM();


  clearInterval(
    timerInterval
  );

  clearInterval(
    countdownInterval
  );


  finish.style.display =
    "flex";


  finalScore.innerText =
    score +
    " POIN";


  const maxScore =
    questions.reduce(
      function(
        total,
        q
      ) {

        return total +
          (Number(q.poin) || 10);

      },
      0
    );


  const accuracy =
    maxScore > 0

      ? Math.round(
          score /
          maxScore *
          100
        )

      : 0;


  if (
    accuracy >= 90
  ) {

    finalMessage.innerText =
      "🏆 RATIO MASTER! Luar biasa!";

  }

  else if (
    accuracy >= 75
  ) {

    finalMessage.innerText =
      "⭐ RATIO EXPERT! Mantap!";

  }

  else if (
    accuracy >= 60
  ) {

    finalMessage.innerText =
      "💪 RATIO EXPLORER! Terus berlatih!";

  }

  else {

    finalMessage.innerText =
      "🌱 Tetap semangat belajar!";

  }

}


/* ==================================================
   RESTART
================================================== */

function restartGame() {

  location.reload();

}


restartBtn.addEventListener(
  "click",
  restartGame
);


playAgain.addEventListener(
  "click",
  restartGame
);


/* ==================================================
   START
================================================== */

loadQuestions();

</script>

</body>

</html>
