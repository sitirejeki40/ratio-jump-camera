<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ratio Jump Camera</title>

  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    window.PoseLandmarker = PoseLandmarker;
    window.FilesetResolver = FilesetResolver;
    window.DrawingUtils = DrawingUtils;
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #edf3f8;
      text-align: center;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 40px;
    }

    .sub {
      margin-bottom: 15px;
      font-size: 20px;
      color: #555;
    }

    .camera-box {
      position: relative;
      width: 92%;
      max-width: 1100px;
      margin: auto;
      overflow: hidden;
      border-radius: 24px;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .zones {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 45% 10% 45%;
      pointer-events: none;
    }

    .left-zone {
      background: rgba(0, 180, 90, 0.16);
      border-right: 3px dashed white;
    }

    .center-zone {
      background: rgba(255, 255, 255, 0.05);
    }

    .right-zone {
      background: rgba(220, 50, 50, 0.16);
      border-left: 3px dashed white;
    }

    .labels {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      display: grid;
      grid-template-columns: 45% 10% 45%;
      pointer-events: none;
    }

    .label {
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 6px #000;
    }

    .status {
      width: 90%;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 18px;
      font-size: 30px;
      font-weight: bold;
    }

    button {
      padding: 20px 40px;
      border: 0;
      border-radius: 18px;
      background: #4285f4;
      color: white;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #debug {
      margin-top: 15px;
      font-size: 20px;
      color: #555;
    }
  </style>
</head>

<body>

  <h1>🔎 RATIO JUMP</h1>

  <div class="sub">
    Deteksi Posisi Tubuh
  </div>

  <div class="camera-box">

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <div class="zones">
      <div class="left-zone"></div>
      <div class="center-zone"></div>
      <div class="right-zone"></div>
    </div>

    <div class="labels">

      <div class="label">
        🟢 SENILAI
      </div>

      <div></div>

      <div class="label">
        🔴 BERBALIK NILAI
      </div>

    </div>

  </div>

  <div id="status" class="status">
    📷 Kamera belum aktif
  </div>

  <button id="startBtn">
    🎥 AKTIFKAN DETEKSI TUBUH
  </button>

  <div id="debug">
    Posisi tubuh: -
  </div>


<script>

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const statusBox = document.getElementById("status");
  const startBtn = document.getElementById("startBtn");
  const debugBox = document.getElementById("debug");

  let poseLandmarker = null;
  let lastVideoTime = -1;


  // ==========================================
  // BUAT POSE LANDMARKER
  // ==========================================

  async function createPoseLandmarker() {

    statusBox.innerText =
      "⏳ Menyiapkan deteksi tubuh...";

    const vision =
      await window.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
      );

    poseLandmarker =
      await window.PoseLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {

            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",

            delegate: "GPU"

          },

          runningMode: "VIDEO",

          numPoses: 1,

          minPoseDetectionConfidence: 0.5,

          minPosePresenceConfidence: 0.5,

          minTrackingConfidence: 0.5

        }
      );

  }


  // ==========================================
  // AKTIFKAN KAMERA
  // ==========================================

  async function startCamera() {

    startBtn.disabled = true;

    try {

      statusBox.innerText =
        "⏳ Meminta izin kamera...";

      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: true,

          audio: false

        });

      video.srcObject = stream;

      await video.play();


      // Tunggu sampai ukuran video tersedia
      if (video.readyState < 2) {

        await new Promise(function(resolve) {

          video.addEventListener(
            "loadeddata",
            resolve,
            { once: true }
          );

        });

      }


      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;


      statusBox.innerText =
        "⏳ Memuat AI deteksi tubuh...";


      await createPoseLandmarker();


      statusBox.innerText =
        "✅ DETEKSI TUBUH AKTIF";

      startBtn.style.display =
        "none";


      requestAnimationFrame(
        detectPose
      );


    } catch (error) {

      console.error(error);

      statusBox.innerHTML =
        "❌ Gagal mengaktifkan deteksi tubuh<br><br>" +
        error.name +
        "<br>" +
        error.message;

      startBtn.disabled = false;

    }

  }


  // ==========================================
  // DETEKSI POSE
  // ==========================================

  function detectPose() {

    if (!poseLandmarker) {

      requestAnimationFrame(
        detectPose
      );

      return;

    }


    if (video.readyState < 2) {

      requestAnimationFrame(
        detectPose
      );

      return;

    }


    if (video.currentTime !== lastVideoTime) {

      lastVideoTime =
        video.currentTime;


      const result =
        poseLandmarker.detectForVideo(
          video,
          performance.now()
        );


      processResult(result);

    }


    requestAnimationFrame(
      detectPose
    );

  }


  // ==========================================
  // PROSES HASIL
  // ==========================================

  function processResult(result) {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    if (
      !result.landmarks ||
      result.landmarks.length === 0
    ) {

      statusBox.innerText =
        "👤 Tubuh belum terdeteksi";

      debugBox.innerText =
        "Posisi tubuh: belum terdeteksi";

      return;

    }


    const landmarks =
      result.landmarks[0];


    // Bahu
    const leftShoulder =
      landmarks[11];

    const rightShoulder =
      landmarks[12];


    // Pinggul
    const leftHip =
      landmarks[23];

    const rightHip =
      landmarks[24];


    // Titik tengah tubuh
    const centerX =
      (
        leftShoulder.x +
        rightShoulder.x +
        leftHip.x +
        rightHip.x
      ) / 4;


    /*
      Karena video ditampilkan mirror,
      koordinat X dibalik untuk membaca
      posisi berdasarkan tampilan layar.
    */

    const displayX =
      1 - centerX;


    const persen =
      Math.round(
        displayX * 100
      );


    debugBox.innerText =
      "Posisi tubuh: " +
      persen +
      "%";


    if (displayX < 0.45) {

      statusBox.innerText =
        "🟢 POSISI: SENILAI";

    }

    else if (displayX > 0.55) {

      statusBox.innerText =
        "🔴 POSISI: BERBALIK NILAI";

    }

    else {

      statusBox.innerText =
        "⚪ POSISI: TENGAH";

    }


    drawLandmarks(
      landmarks
    );

  }


  // ==========================================
  // GAMBAR TITIK TUBUH
  // ==========================================

function drawLandmarks(landmarks) {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#00ff00";

  for (const point of landmarks) {

    if (
      point.visibility !== undefined &&
      point.visibility < 0.4
    ) {
      continue;
    }

    // Balik posisi X agar titik mengikuti
    // tampilan video yang sudah di-mirror
    const x =
      (1 - point.x) * canvas.width;

    const y =
      point.y * canvas.height;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      5,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


  // ==========================================
  // TOMBOL START
  // ==========================================

  startBtn.addEventListener(
    "click",
    startCamera
  );

</script>

</body>
</html>
