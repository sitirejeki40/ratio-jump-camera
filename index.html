/* =========================================
   CAMERA
========================================= */

#video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform: scaleX(-1);

  background: #000;

  z-index: 1;

/* =========================================
   OVERLAY
========================================= */

.dark-overlay {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(

      rgba(0,0,0,.45)

  pointer-events: none;

  z-index: 2;
}


/* =========================================
   3 ZONA
========================================= */

.zone-overlay {
  position: absolute;
  inset: 0;

  display: grid;
  grid-template-columns: 42% 16% 42%;

  z-index: 3;

  pointer-events: none;
}

.zone-left {
  background: rgba(40,215,85,.18);

  border-right:
    4px dashed
    rgba(255,255,255,.9);
}

.zone-middle {
  position: relative;

  background:
    rgba(255,255,255,.06);

  border-left:
    1px solid
    rgba(255,255,255,.12);

  border-right:
    1px solid
    rgba(255,255,255,.12);
}

.zone-right {

    rgba(235,65,65,.18);

  border-left:
    4px dashed
    rgba(255,255,255,.9);
}


/* =========================================
   STANDBY
========================================= */

.standby {

  left: 50%;

  border-radius: 10px;

  font-weight: 900;

/* ==================================================
   AUDIO
================================================== */

function initAudio() {

  if (audioCtx) {

    if (
      audioCtx.state ===
      "suspended"
    ) {

      audioCtx.resume();

    }

    return;

  }


  const AC =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AC) return;


  audioCtx =
    new AC();


  masterGain =
    audioCtx.createGain();


  masterGain.gain.value =
    0.15;


  masterGain.connect(
    audioCtx.destination
  );

}


function tone(
  frequency,
  duration,
  volume,
  type
) {

  if (
    !audioCtx ||
    !masterGain
  ) {

    return;

  }


  const osc =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  osc.type =
    type || "sine";


  osc.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    0.001,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    volume || 0.05,
    audioCtx.currentTime + 0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + duration
  );


  osc.connect(gain);

  gain.connect(
    masterGain
  );


  osc.start();

  osc.stop(
    audioCtx.currentTime +
    duration +
    0.03
  );

}


/* ==================================================
   BACKSOUND
================================================== */

function startBGM() {

  if (!bgmOn) return;

  initAudio();

  if (!audioCtx) return;

  if (bgmTimer) return;


  const melody = [

    523.25,
    659.25,
    783.99,
    659.25,
    587.33,
    698.46,
    880.00,
    698.46

  ];


  const bass = [

    130.81,
    130.81,
    146.83,
    146.83,
    174.61,
    174.61,
    155.56,
    155.56

  ];


  bgmStep = 0;


  function step() {

    if (!bgmOn) return;


    tone(
      melody[
        bgmStep %
        melody.length
      ],
      0.35,
      0.035,
      "sine"
    );


    if (
      bgmStep % 2 === 0
    ) {

      tone(
        bass[
          bgmStep %
          bass.length
        ],
        0.4,
        0.02,
        "triangle"
      );

    }


    bgmStep++;

  }


  step();


  bgmTimer =
    setInterval(
      step,
      470
    );

}


function stopBGM() {

  if (bgmTimer) {

    clearInterval(
      bgmTimer
    );

    bgmTimer = null;

  }

}


/* ==================================================
   YEAY
================================================== */

function playYeay() {

  initAudio();


  if (
    "speechSynthesis"
    in window
  ) {

    const speech =
      new SpeechSynthesisUtterance(
        "Yeay!"
      );


    speech.lang =
      "en-US";

    speech.rate =
      1.15;

    speech.pitch =
      1.35;

    speech.volume =
      1;


    speechSynthesis.cancel();

    speechSynthesis.speak(
      speech
    );

  }


  const notes = [
    523.25,
    659.25,
    783.99,
    1046.50
  ];


  notes.forEach(
    function(
      note,
      index
    ) {

      setTimeout(
        function() {

          tone(
            note,
            0.2,
            0.10,
            "triangle"
          );

        },
        index * 120
      );

    }
  );

}


/* ==================================================
   BOOM
================================================== */

function playBoom() {

  initAudio();


  if (!audioCtx) return;


  const osc =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  osc.type =
    "sawtooth";


  osc.frequency.setValueAtTime(
    150,
    audioCtx.currentTime
  );


  osc.frequency.exponentialRampToValueAtTime(
    35,
    audioCtx.currentTime + 0.5
  );


  gain.gain.setValueAtTime(
    0.001,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.35,
    audioCtx.currentTime + 0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + 0.5
  );


  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  osc.start();

  osc.stop(
    audioCtx.currentTime +
    0.55
  );

}

function loadQuestions() {

  questionEl.innerText =
    "⏳ Mengambil soal dari Spreadsheet...";


  const callbackName =
    "ratioJumpQuestions_" +
    Date.now();

        questions =

          questions.length === 0
        ) {

          questionEl.innerText =

          return;

        }


        questions =
          questions.sort(
            function() {

              return (
                Math.random() -

              );

            }
          );


        totalEl.innerText =
          questions.length;


        showQuestion();

      }

      catch(error) {

        questionEl.innerText =
          "❌ Data soal tidak dapat dibaca.";

      }


      // Bersihkan global callback
      delete window[callbackName];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?api=questions" +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  script.async =
    true;


  script.onload =
    function() {

      setTimeout(
        function() {

          if (
            window[
              callbackName
            ]
          ) {

            questionEl.innerText =
              "❌ Soal tidak diterima dari Apps Script.";

            delete window[
              callbackName
            ];

          }

        },
        5000
      );

    };


  script.onerror =
    function() {

      questionEl.innerText =
        "❌ Gagal terhubung ke Google Spreadsheet.";

      delete window[
        callbackName
      ];

    };


  document.body.appendChild(
    script
  );

}


/* ==================================================
   TAMPILKAN SOAL
================================================== */

function showQuestion() {

  clearInterval(
    timerInterval
  );

  clearInterval(
    countdownInterval
  );


  selectedAnswer =
    null;


  revealed =
    false;


  const q =
    questions[currentIndex];


  numberEl.innerText =
    currentIndex + 1;


  questionEl.innerText =
    q.soal;


  timerEl.innerText =
    "-";


  progressEl.style.width =
    "100%";


  feedbackEl.innerHTML =
    "Bersiap untuk <b>JUMP!</b> 🏃";


  choiceA.className =
    "choice choice-a";


  choiceB.className =
    "choice choice-b";


  revealBtn.disabled =
    true;


  revealBtn.style.display =
    "inline-block";


  nextBtn.style.display =
    "none";


  mulaiCountdown();

}


/* ==================================================
   COUNTDOWN
================================================== */

function mulaiCountdown() {

  countdown.style.display =
    "flex";


  let n =
    3;


  countNumber.innerText =
    n;


  countdownInterval =
    setInterval(
      function() {

        n--;


        if (
          n > 0
        ) {

          countNumber.innerText =
            n;

        }

        else {

          clearInterval(
            countdownInterval
          );


          countNumber.innerText =
            "JUMP!";


          setTimeout(
            function() {

              countdown.style.display =
                "none";


              mulaiTimer();

            },
            700
          );

        }

      },
      700
    );

}


/* ==================================================
   TIMER
================================================== */

function mulaiTimer() {

  let time =
    5;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  startBGM();


  timerInterval =
    setInterval(
      function() {

        time -=
          0.1;


        timerEl.innerText =
          Math.max(
            0,
            Math.ceil(
              time
            )
          );


        progressEl.style.width =
          Math.max(
            0,
            (time / 5) * 100
          ) + "%";


        if (
          time <= 0
        ) {

          clearInterval(
            timerInterval
          );


          stopBGM();


          timerEl.innerText =
            "⏰ WAKTU HABIS";


          progressEl.style.width =
            "0%";


          revealBtn.disabled =
            false;


          feedbackEl.innerHTML =
            "🏃 <b>WAKTU HABIS!</b><br>" +
            "Sekarang pilih A atau B sesuai posisi siswa.";

        }

      },
      100
    );

}


/* ==================================================
   PILIH A
================================================== */

choiceA.addEventListener(
  "click",
  function() {

    if (
      revealed ||
      revealBtn.disabled
    ) {

      return;

    }


    selectedAnswer =
      "SENILAI";


    choiceA.classList.add(
      "selected"
    );


    choiceB.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅰️ Pilihan siswa: <b>SENILAI</b>";

  }
);


/* ==================================================
   PILIH B
================================================== */

choiceB.addEventListener(
  "click",
  function() {

    if (
      revealed ||
      revealBtn.disabled
    ) {

      return;

    }


    selectedAnswer =
      "BERBALIK NILAI";


    choiceB.classList.add(
      "selected"
    );


    choiceA.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅱️ Pilihan siswa: <b>BERBALIK NILAI</b>";

  }
);


/* ==================================================
   REVEAL
================================================== */

revealBtn.addEventListener(
  "click",
  function() {

    if (
      revealed
    ) {

      return;

    }


    if (
      !selectedAnswer
    ) {

      feedbackEl.innerHTML =
        "⚠️ Pilih A atau B terlebih dahulu.";

      return;

    }


    revealed =
      true;


    clearInterval(
      timerInterval
    );


    stopBGM();


    const q =
      questions[currentIndex];


    const benar =
      selectedAnswer ===
      q.jawaban;


    if (benar) {

      score +=
        Number(q.poin) ||
        10;


      scoreEl.innerText =
        score;


      playYeay();


      if (
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "correct"
        );

        choiceB.classList.add(
          "dim"
        );

      }

      else {

        choiceB.classList.add(
          "correct"
        );

        choiceA.classList.add(
          "dim"
        );

      }


      feedbackEl.innerHTML =
        "🎉 <b>YEAY! BENAR!</b><br>" +
        "+" +
        (Number(q.poin) || 10) +
        " POIN<br><br>" +
        q.pembahasan;

    }

    else {

      playBoom();


      if (
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "wrong"
        );

        choiceB.classList.add(
          "correct"
        );

      }

      else {

        choiceB.classList.add(
          "wrong"
        );

        choiceA.classList.add(
          "correct"
        );

      }


      feedbackEl.innerHTML =
        "💥 <b>BOOM!</b><br>" +
        "Jawaban benar: <b>" +
        q.jawaban +
        "</b><br><br>" +
        q.pembahasan;

    }


    revealBtn.style.display =
      "none";


    nextBtn.style.display =
      "inline-block";


    saveResult(
      q,
      selectedAnswer,
      benar
    );

  }
);


/* ==================================================
   SIMPAN HASIL LANGSUNG KE APPS SCRIPT
================================================== */

function saveResult(
  q,
  answer,
  benar
) {

  const callbackName =
    "ratioJumpSave_" +
    Date.now();


  window[callbackName] =
    function(result) {

      console.log(
        "Hasil tersimpan:",
        result
      );


      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    API_URL +

    "?api=save" +

    "&callback=" +
    callbackName +

    "&pemain=" +
    encodeURIComponent(
      "Kelas VII"
    ) +

    "&id=" +
    encodeURIComponent(
      q.id
    ) +

    "&jawaban=" +
    encodeURIComponent(
      answer
    ) +

    "&jawabanBenar=" +
    encodeURIComponent(
      q.jawaban
    ) +

    "&status=" +
    encodeURIComponent(
      benar
        ? "BENAR"
        : "SALAH"
    ) +

    "&skor=" +
    encodeURIComponent(
      benar
        ? Number(q.poin) || 10
        : 0
    ) +

    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


/* ==================================================
   NEXT
================================================== */

nextBtn.addEventListener(
  "click",
  function() {

    currentIndex++;


    if (
      currentIndex >=
      questions.length
    ) {

      finishGame();

      return;

    }


    showQuestion();

  }
);


/* ==================================================
   FINISH
================================================== */

function finishGame() {

  stopBGM();

  clearInterval(
    timerInterval
  );

  clearInterval(
    countdownInterval
  );


  finish.style.display =
    "flex";


  finalScore.innerText =
    score +
    " POIN";


  const max =
    questions.reduce(
      function(
        total,
        q
      ) {

        return total +
          (Number(q.poin) || 10);

      },
      0
    );


  const accuracy =
    max > 0
      ? Math.round(
          score /
          max *
          100
        )
      : 0;


  if (
    accuracy >= 90
  ) {

    finalMessage.innerText =
      "🏆 RATIO MASTER!";

  }

  else if (
    accuracy >= 75
  ) {

    finalMessage.innerText =
      "⭐ RATIO EXPERT!";

  }

  else if (
    accuracy >= 60
  ) {

    finalMessage.innerText =
      "💪 RATIO EXPLORER!";

  }

  else {

    finalMessage.innerText =
      "🌱 Tetap semangat belajar!";

  }

}


/* ==================================================
   RESTART
================================================== */

restartBtn.addEventListener(
  "click",
  function() {

    location.reload();

  }
);


playAgain.addEventListener(
  "click",
  function() {

    location.reload();

  }
);


/* ==================================================
   MULAI LOAD
================================================== */

loadQuestions();

</script>

</body>
</html>
