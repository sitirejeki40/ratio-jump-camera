<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;
  padding: 0;

  height: 100%;

/* =====================================================

===================================================== */

/* =====================================================
   CAMERA
===================================================== */

  inset: 0;

  height: 100%;

  transform:
    scaleX(-1);

  z-index: 1;

}


/* =====================================================
   DARK OVERLAY
===================================================== */

.dark-overlay {

  inset: 0;

      to bottom,
      rgba(0,0,0,0.62),
      rgba(0,0,0,0.06) 30%,

      rgba(0,0,0,0.52)

  pointer-events: none;

  z-index: 2;

}


/* =====================================================
   3 ZONA KAMERA
===================================================== */

.zone-overlay {

  position: absolute;

  inset: 0;

  display: grid;

  grid-template-columns:
    42% 16% 42%;

  pointer-events: none;

  z-index: 3;

}


.zone-left {

  background:
    rgba(40,210,90,0.18);

  border-right:
    4px dashed
    rgba(255,255,255,0.9);

}


.zone-center {

  position: relative;

  background:
    rgba(255,255,255,0.06);

}


.zone-right {

  background:
    rgba(240,60,60,0.18);

  border-left:
    4px dashed
    rgba(255,255,255,0.9);

}


/* =====================================================
   STANDBY
===================================================== */

.standby {

  position: absolute;

  top: 50%;
  left: 50%;

<script>

/* =====================================================
   API GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxoP3_605xuQQb3Rb0uwGPDNLHBq6Xdju3TYYIzom_XovINiPxofhUTeEF20_K8mDFb/exec";


/* =====================================================
   GAME DATA
===================================================== */

let questions = [];

let currentIndex = 0;

let score = 0;

let selectedAnswer = null;

let revealed = false;

let timerInterval = null;

let countdownInterval = null;

let timeLeft = 5;


/* =====================================================
   AUDIO
===================================================== */

let audioCtx = null;

let masterGain = null;

let bgmTimer = null;

let bgmStep = 0;

let bgmOn = true;


/* =====================================================
   INIT AUDIO
===================================================== */

function initAudio() {

  if (audioCtx) {

    if (audioCtx.state === "suspended") {

      audioCtx.resume();

    }

    return;

  }


  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) {

    return;

  }


  audioCtx =
    new AudioContext();


  masterGain =
    audioCtx.createGain();


  masterGain.gain.value =
    0.18;


  masterGain.connect(
    audioCtx.destination
  );

}


/* =====================================================
   MAIN SOUND
===================================================== */

function playTone(
  frequency,
  duration,
  volume = 0.10,
  type = "sine"
) {

  if (!audioCtx ||
      !masterGain ||
      !bgmOn) {

    return;

  }


  const oscillator =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  oscillator.type =
    type;


  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    0.001,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    volume,
    audioCtx.currentTime + 0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + duration
  );


  oscillator.connect(gain);

  gain.connect(masterGain);


  oscillator.start();


  oscillator.stop(
    audioCtx.currentTime +
    duration +
    0.03
  );

}


/* =====================================================
   BACKSOUND
===================================================== */

function startBackground() {

  if (!bgmOn) {

    return;

  }


  initAudio();


  if (!audioCtx) {

    return;

  }


  if (bgmTimer) {

    return;

  }


  bgmStep =
    0;


  playBackgroundStep();


  bgmTimer =
    setInterval(
      playBackgroundStep,
      520
    );

}


function playBackgroundStep() {

  if (!audioCtx ||
      !bgmOn) {

    return;

  }


  const melody = [

    523.25,
    659.25,
    783.99,
    659.25,

    587.33,
    698.46,
    880.00,
    698.46

  ];


  const bass = [

    130.81,
    130.81,
    146.83,
    146.83,

    174.61,
    174.61,
    155.56,
    155.56

  ];


  const note =
    melody[
      bgmStep %
      melody.length
    ];


  const bassNote =
    bass[
      bgmStep %
      bass.length
    ];


  playTone(
    note,
    0.38,
    0.045,
    "sine"
  );


  if (
    bgmStep % 2 === 0
  ) {

    playTone(
      bassNote,
      0.45,
      0.025,
      "triangle"
    );

  }


  bgmStep++;

}


/* =====================================================
   STOP BACKSOUND
===================================================== */

function stopBackground() {

  if (bgmTimer) {

    clearInterval(
      bgmTimer
    );

    bgmTimer =
      null;

  }

}


/* =====================================================
   YEAY
===================================================== */

function playYeay() {

  initAudio();


  // Suara ucapan
  if (
    "speechSynthesis"
    in window
  ) {

    const voice =
      new SpeechSynthesisUtterance(
        "Yeay!"
      );


    voice.lang =
      "id-ID";

    voice.rate =
      1.15;

    voice.pitch =
      1.35;

    voice.volume =
      1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
      voice
    );

  }


  // Nada kemenangan

  if (!audioCtx) {

    return;

  }


  const notes = [

    523.25,
    659.25,
    783.99,
    1046.50

  ];


  notes.forEach(
    function(
      frequency,
      index
    ) {

      setTimeout(
        function() {

          playTone(
            frequency,
            0.22,
            0.12,
            "triangle"
          );

        },
        index * 120
      );

    }
  );

}


/* =====================================================
   BOOM
===================================================== */

function playBoom() {

  initAudio();


  if (!audioCtx ||
      !masterGain) {

    return;

  }


  const oscillator =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  oscillator.type =
    "sawtooth";


  oscillator.frequency.setValueAtTime(
    160,
    audioCtx.currentTime
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    40,
    audioCtx.currentTime + 0.5
  );


  gain.gain.setValueAtTime(
    0.001,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.35,
    audioCtx.currentTime + 0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + 0.5
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioCtx.destination
  );


  oscillator.start();


  oscillator.stop(
    audioCtx.currentTime +
    0.55
  );

}


/* =====================================================
   KAMERA
===================================================== */

const video =
document.getElementById("video");


const cameraBtn =
document.getElementById("cameraBtn");


const cameraStatus =
document.getElementById("cameraStatus");


cameraBtn.addEventListener(
  "click",
  async function() {

    try {

      // Inisialisasi audio melalui user gesture
      initAudio();


      const stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: true,

            audio: false

          });


      video.srcObject =
        stream;


      cameraStatus.innerHTML =
        "🟢 KAMERA LIVE";


      cameraBtn.innerText =
        "✅ KAMERA AKTIF";


      cameraBtn.disabled =
        true;

    }


    catch(error) {

      cameraStatus.innerHTML =
        "🔴 KAMERA GAGAL";


      alert(
        "Kamera tidak dapat dibuka:\n\n" +
        error.message
      );

    }

  }
);


/* =====================================================
   BGM BUTTON
===================================================== */

const muteBtn =
document.getElementById("muteBtn");


const volumeIndicator =
document.getElementById(
  "volumeIndicator"
);


muteBtn.addEventListener(
  "click",
  function() {

    bgmOn =
      !bgmOn;


    if (bgmOn) {

      muteBtn.innerText =
        "🔊 BGM";


      volumeIndicator.innerText =
        "🔊 BGM ON";


      startBackground();

    }

    else {

      muteBtn.innerText =
        "🔇 BGM";


      volumeIndicator.innerText =
        "🔇 BGM OFF";


      stopBackground();

    }

  }
);


/* =====================================================
   FULLSCREEN
===================================================== */

document
  .getElementById("fullscreenBtn")
  .addEventListener(
    "click",
    function() {

      if (
        document.documentElement
          .requestFullscreen
      ) {

        document.documentElement
          .requestFullscreen();

      }

    }
  );


/* =====================================================
   ELEMENT GAME
===================================================== */

const questionEl =
document.getElementById("question");


const numberEl =
document.getElementById("number");


const totalEl =
document.getElementById("total");


const scoreEl =
document.getElementById("score");


const timerEl =
document.getElementById("timer");


const progressEl =
document.getElementById("progress");


const feedbackEl =
document.getElementById("feedback");


const choiceA =
document.getElementById("choiceA");


const choiceB =
document.getElementById("choiceB");


const revealBtn =
document.getElementById("revealBtn");


const nextBtn =
document.getElementById("nextBtn");


const restartBtn =
document.getElementById("restartBtn");


const countdown =
document.getElementById("countdown");


const countNumber =
document.getElementById("countNumber");


const finish =
document.getElementById("finish");


const finalScore =
document.getElementById("finalScore");


const finalMessage =
document.getElementById("finalMessage");


const playAgain =
document.getElementById("playAgain");


/* =====================================================
   AMBIL SOAL
===================================================== */

function loadQuestions() {

  questionEl.innerText =
    "⏳ Mengambil soal...";


  window.receiveQuestions =
    function(data) {

      questions =
        Array.isArray(data)
          ? data
          : [];


      if (
        questions.length === 0
      ) {

        questionEl.innerText =
          "❌ Bank soal kosong.";

        return;

      }


      // Acak

      questions.sort(
        function() {

          return (
            Math.random() -
            0.5
          );

        }
      );


      totalEl.innerText =
        questions.length;


      showQuestion();

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?api=questions" +
    "&callback=receiveQuestions" +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      questionEl.innerHTML =
        "❌ Gagal mengambil soal.";

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   SHOW SOAL
===================================================== */

function showQuestion() {

  clearInterval(
    timerInterval
  );

  clearInterval(
    countdownInterval
  );


  selectedAnswer =
    null;


  revealed =
    false;


  const q =
    questions[currentIndex];


  numberEl.innerText =
    currentIndex + 1;


  questionEl.innerText =
    q.soal;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  feedbackEl.innerHTML =
    "Bersiap untuk <b>JUMP!</b> 🏃";


  choiceA.className =
    "choice choice-a";


  choiceB.className =
    "choice choice-b";


  revealBtn.style.display =
    "inline-block";


  revealBtn.disabled =
    true;


  nextBtn.style.display =
    "none";


  mulaiCountdown();

}


/* =====================================================
   COUNTDOWN
===================================================== */

function mulaiCountdown() {

  countdown.style.display =
    "flex";


  let n =
    3;


  countNumber.innerText =
    n;


  countdownInterval =
    setInterval(
      function() {

        n--;


        if(n > 0) {

          countNumber.innerText =
            n;

        }

        else {

          clearInterval(
            countdownInterval
          );


          countNumber.innerText =
            "JUMP!";


          setTimeout(
            function() {

              countdown.style.display =
                "none";


              mulaiTimer();

            },
            700
          );

        }

      },
      700
    );

}


/* =====================================================
   TIMER
===================================================== */

function mulaiTimer() {

  timeLeft =
    5;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  // Mulai backsound saat mengerjakan
  startBackground();


  timerInterval =
    setInterval(
      function() {

        timeLeft -=
          0.1;


        timerEl.innerText =
          Math.max(
            0,
            Math.ceil(
              timeLeft
            )
          );


        progressEl.style.width =
          Math.max(
            0,
            (timeLeft / 5) * 100
          ) + "%";


        if(
          timeLeft <= 0
        ) {

          clearInterval(
            timerInterval
          );


          stopBackground();


          timerEl.innerText =
            "⏰ WAKTU HABIS";


          progressEl.style.width =
            "0%";


          revealBtn.disabled =
            false;


          feedbackEl.innerHTML =
            "🏃 <b>Waktu habis!</b> " +
            "Sekarang pilih A atau B sesuai posisi siswa, " +
            "lalu lihat jawabannya.";

        }

      },
      100
    );

}


/* =====================================================
   PILIH A
===================================================== */

choiceA.addEventListener(
  "click",
  function() {

    if(revealed) return;


    selectedAnswer =
      "SENILAI";


    choiceA.classList.add(
      "selected"
    );


    choiceB.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅰️ Pilihan siswa: <b>SENILAI</b>";

  }
);


/* =====================================================
   PILIH B
===================================================== */

choiceB.addEventListener(
  "click",
  function() {

    if(revealed) return;


    selectedAnswer =
      "BERBALIK NILAI";


    choiceB.classList.add(
      "selected"
    );


    choiceA.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅱️ Pilihan siswa: <b>BERBALIK NILAI</b>";

  }
);


/* =====================================================
   LIHAT JAWABAN
===================================================== */

revealBtn.addEventListener(
  "click",
  function() {

    if(revealed) return;


    if(!selectedAnswer) {

      feedbackEl.innerHTML =
        "⚠️ Pilih A atau B terlebih dahulu.";

      return;

    }


    revealed =
      true;


    stopBackground();


    const q =
      questions[currentIndex];


    const benar =
      selectedAnswer ===
      q.jawaban;


    if(benar) {

      score +=
        Number(q.poin) || 10;


      scoreEl.innerText =
        score;


      playYeay();


      if(
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "correct"
        );

        choiceB.classList.add(
          "dim"
        );

      }

      else {

        choiceB.classList.add(
          "correct"
        );

        choiceA.classList.add(
          "dim"
        );

      }


      feedbackEl.innerHTML =
        "🎉 <b>BENAR!</b><br>" +
        "+" +
        (Number(q.poin) || 10) +
        " POIN<br><br>" +
        q.pembahasan;

    }


    else {

      playBoom();


      if(
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "wrong"
        );

        choiceB.classList.add(
          "correct"
        );

      }

      else {

        choiceB.classList.add(
          "wrong"
        );

        choiceA.classList.add(
          "correct"
        );

      }


      feedbackEl.innerHTML =
        "💥 <b>BOOM!</b> 😅<br>" +
        "Jawaban benar: <b>" +
        q.jawaban +
        "</b><br><br>" +
        q.pembahasan;

    }


    revealBtn.style.display =
      "none";


    nextBtn.style.display =
      "inline-block";


    saveResult(
      q,
      selectedAnswer,
      benar
    );

  }
);


/* =====================================================
   SAVE RESULT
===================================================== */

function saveResult(
  q,
  answer,
  benar
) {

  window.saveAck =
    function(result) {

      console.log(
        "Hasil tersimpan:",
        result
      );

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    API_URL +

    "?api=save" +

    "&callback=saveAck" +

    "&pemain=" +
    encodeURIComponent(
      "Kelas VII"
    ) +

    "&id=" +
    encodeURIComponent(
      q.id
    ) +

    "&jawaban=" +
    encodeURIComponent(
      answer
    ) +

    "&jawabanBenar=" +
    encodeURIComponent(
      q.jawaban
    ) +

    "&status=" +
    encodeURIComponent(
      benar
        ? "BENAR"
        : "SALAH"
    ) +

    "&skor=" +
    encodeURIComponent(
      benar
        ? Number(q.poin) || 10
        : 0
    );


  document.body.appendChild(
    script
  );

}


/* =====================================================
   NEXT
===================================================== */

nextBtn.addEventListener(
  "click",
  function() {

    currentIndex++;


    if(
      currentIndex >=
      questions.length
    ) {

      finishGame();

      return;

    }


    showQuestion();

  }
);


/* =====================================================
   FINISH
===================================================== */

function finishGame() {

  clearInterval(
    timerInterval
  );

  clearInterval(
    countdownInterval
  );

  stopBackground();


  finish.style.display =
    "flex";


  finalScore.innerText =
    score +
    " POIN";


  const maxScore =
    questions.reduce(
      function(
        total,
        q
      ) {

        return total +
          (Number(q.poin) || 10);

      },
      0
    );


  const accuracy =
    maxScore > 0

      ? Math.round(
          score /
          maxScore *
          100
        )

      : 0;


  if(
    accuracy >= 90
  ) {

    finalMessage.innerText =
      "🏆 RATIO MASTER!";

  }

  else if(
    accuracy >= 75
  ) {

    finalMessage.innerText =
      "⭐ RATIO EXPERT!";

  }

  else if(
    accuracy >= 60
  ) {

    finalMessage.innerText =
      "💪 RATIO EXPLORER!";

  }

  else {

    finalMessage.innerText =
      "🌱 TERUS BERLATIH!";

  }

}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {

  location.reload();

}


restartBtn.addEventListener(
  "click",
  restartGame
);


playAgain.addEventListener(
  "click",
  restartGame
);


/* =====================================================
   START
===================================================== */

loadQuestions();

</script>


</body>
</html>
