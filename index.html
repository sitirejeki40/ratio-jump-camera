<script>


/* =================================================
   APPS SCRIPT URL
================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxoP3_605xuQQb3Rb0uwGPDNLHBq6Xdju3TYYIzom_XovINiPxofhUTeEF20_K8mDFb/exec";


/* =================================================
   GAME DATA
================================================= */

let questions = [];

let currentIndex = 0;

let score = 0;

let selectedAnswer = null;

let revealed = false;

let timerInterval = null;

let countdownInterval = null;

let gameStarted = false;

let roundRunning = false;


/* =================================================
   AUDIO DATA
================================================= */

let audioCtx = null;

let masterGain = null;

let bgmTimer = null;

let bgmOn = true;

let bgmStep = 0;


/* =================================================
   ELEMENT
================================================= */

const video =
  document.getElementById("video");

const cameraBtn =
  document.getElementById("cameraBtn");

const cameraStatus =
  document.getElementById("cameraStatus");

const bgmStatus =
  document.getElementById("bgmStatus");

const questionEl =
  document.getElementById("question");

const numberEl =
  document.getElementById("number");

const totalEl =
  document.getElementById("total");

const scoreEl =
  document.getElementById("score");

const timerEl =
  document.getElementById("timer");

const progressEl =
  document.getElementById("progress");

const feedbackEl =
  document.getElementById("feedback");

const choiceA =
  document.getElementById("choiceA");

const choiceB =
  document.getElementById("choiceB");

const revealBtn =
  document.getElementById("revealBtn");

const nextBtn =
  document.getElementById("nextBtn");

const restartBtn =
  document.getElementById("restartBtn");

const countdown =
  document.getElementById("countdown");

const countNumber =
  document.getElementById("countNumber");

const finish =
  document.getElementById("finish");

const finalScore =
  document.getElementById("finalScore");

const finalMessage =
  document.getElementById("finalMessage");

const playAgain =
  document.getElementById("playAgain");

const muteBtn =
  document.getElementById("muteBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");


/* =================================================
   AUDIO INIT
================================================= */

function initAudio() {

  if (audioCtx) {

    if (
      audioCtx.state === "suspended"
    ) {

      audioCtx.resume();

    }

    return;

  }


  const AC =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AC) {

    return;

  }


  audioCtx =
    new AC();


  masterGain =
    audioCtx.createGain();


  masterGain.gain.value =
    0.15;


  masterGain.connect(
    audioCtx.destination
  );

}


/* =================================================
   BASIC TONE
================================================= */

function tone(
  frequency,
  duration,
  volume,
  type
) {

  if (
    !audioCtx ||
    !masterGain
  ) {

    return;

  }


  const osc =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  osc.type =
    type ||
    "sine";


  osc.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    0.001,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    volume || 0.05,
    audioCtx.currentTime + 0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + duration
  );


  osc.connect(gain);

  gain.connect(masterGain);


  osc.start();

  osc.stop(
    audioCtx.currentTime +
    duration +
    0.03
  );

}


/* =================================================
   BGM
================================================= */

function startBGM() {

  if (!bgmOn) {

    return;

  }


  initAudio();


  if (!audioCtx) {

    return;

  }


  if (bgmTimer) {

    return;

  }


  const melody = [

    523.25,
    659.25,
    783.99,
    659.25,

    587.33,
    698.46,
    880.00,
    698.46

  ];


  const bass = [

    130.81,
    130.81,
    146.83,
    146.83,

    174.61,
    174.61,
    155.56,
    155.56

  ];


  bgmStep =
    0;


  function playStep() {

    if (!bgmOn) {

      return;

    }


    tone(
      melody[
        bgmStep %
        melody.length
      ],
      0.35,
      0.032,
      "sine"
    );


    if (
      bgmStep % 2 === 0
    ) {

      tone(
        bass[
          bgmStep %
          bass.length
        ],
        0.40,
        0.020,
        "triangle"
      );

    }


    bgmStep++;

  }


  playStep();


  bgmTimer =
    setInterval(
      playStep,
      470
    );

}


/* =================================================
   STOP BGM
================================================= */

function stopBGM() {

  if (bgmTimer) {

    clearInterval(
      bgmTimer
    );

    bgmTimer =
      null;

  }

}


/* =================================================
   YEAY
================================================= */

function playYeay() {

  initAudio();


  if (
    "speechSynthesis"
    in window
  ) {

    const speech =
      new SpeechSynthesisUtterance(
        "Yeay!"
      );


    speech.lang =
      "en-US";

    speech.rate =
      1.15;

    speech.pitch =
      1.35;

    speech.volume =
      1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
      speech
    );

  }


  const notes = [

    523.25,
    659.25,
    783.99,
    1046.50

  ];


  notes.forEach(
    function(
      note,
      index
    ) {

      setTimeout(
        function() {

          tone(
            note,
            0.2,
            0.10,
            "triangle"
          );

        },
        index * 120
      );

    }
  );

}


/* =================================================
   BOOM
================================================= */

function playBoom() {

  initAudio();


  if (!audioCtx) {

    return;

  }


  const osc =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  osc.type =
    "sawtooth";


  osc.frequency.setValueAtTime(
    150,
    audioCtx.currentTime
  );


  osc.frequency.exponentialRampToValueAtTime(
    35,
    audioCtx.currentTime + 0.5
  );


  gain.gain.setValueAtTime(
    0.001,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    0.35,
    audioCtx.currentTime + 0.03
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + 0.5
  );


  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  osc.start();

  osc.stop(
    audioCtx.currentTime +
    0.55
  );

}


/* =================================================
   KAMERA
================================================= */

cameraBtn.addEventListener(
  "click",
  async function() {

    initAudio();


    try {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Browser tidak mendukung akses kamera."
        );

      }


      const stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: true,

            audio: false

          });


      video.srcObject =
        stream;


      cameraStatus.innerText =
        "🟢 KAMERA LIVE";


      cameraBtn.innerText =
        "✅ KAMERA AKTIF";


      cameraBtn.disabled =
        true;


      /*
        Baru setelah kamera aktif,
        mulai ronde.
      */

      if (
        questions.length > 0 &&
        !gameStarted
      ) {

        gameStarted =
          true;

        showQuestion();

      }

    }


    catch(error) {

      console.error(error);


      cameraStatus.innerText =
        "🔴 KAMERA GAGAL";


      alert(
        "Kamera tidak dapat dibuka:\n\n" +
        error.message
      );

    }

  }
);


/* =================================================
   FULLSCREEN
================================================= */

fullscreenBtn.addEventListener(
  "click",
  function() {

    if (
      document.documentElement.requestFullscreen
    ) {

      document.documentElement
        .requestFullscreen();

    }

  }
);


/* =================================================
   BGM BUTTON
================================================= */

muteBtn.addEventListener(
  "click",
  function() {

    initAudio();


    bgmOn =
      !bgmOn;


    if (bgmOn) {

      muteBtn.innerText =
        "🔊 BGM";

      bgmStatus.innerText =
        "🔊 BGM ON";


      if (roundRunning) {

        startBGM();

      }

    }

    else {

      muteBtn.innerText =
        "🔇 BGM";

      bgmStatus.innerText =
        "🔇 BGM OFF";

      stopBGM();

    }

  }
);


/* =================================================
   LOAD SOAL
================================================= */

function loadQuestions() {

  questionEl.innerText =
    "⏳ Mengambil soal dari Spreadsheet...";


  const callbackName =
    "ratioJumpQuestions_" +
    Date.now();


  window[callbackName] =
    function(data) {

      delete window[callbackName];


      if (
        !Array.isArray(data)
      ) {

        questionEl.innerText =
          "❌ Data soal tidak valid.";

        return;

      }


      questions =
        data;


      if (
        questions.length === 0
      ) {

        questionEl.innerText =
          "❌ Bank soal kosong.";

        return;

      }


      questions.sort(
        function() {

          return (
            Math.random() -
            0.5
          );

        }
      );


      totalEl.innerText =
        questions.length;


      /*
        Jangan mulai countdown sebelum
        kamera aktif.
      */

      if (
        gameStarted
      ) {

        showQuestion();

      }

      else {

        questionEl.innerText =
          questions[0].soal;


        feedbackEl.innerHTML =
          "🎥 Klik <b>KAMERA</b> untuk memulai.";

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?api=questions" +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  script.async =
    true;


  script.onerror =
    function() {

      delete window[callbackName];


      questionEl.innerText =
        "❌ Gagal menghubungkan ke Spreadsheet.";

      feedbackEl.innerHTML =
        "Periksa deployment Web App Apps Script.";

    };


  document.body.appendChild(
    script
  );

}


/* =================================================
   SHOW QUESTION
================================================= */

function showQuestion() {

  clearInterval(
    timerInterval
  );

  clearInterval(
    countdownInterval
  );


  stopBGM();


  if (
    currentIndex >=
    questions.length
  ) {

    finishGame();

    return;

  }


  selectedAnswer =
    null;


  revealed =
    false;


  roundRunning =
    false;


  const q =
    questions[currentIndex];


  numberEl.innerText =
    currentIndex + 1;


  questionEl.innerText =
    q.soal;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  feedbackEl.innerHTML =
    "Bersiap untuk <b>JUMP!</b> 🏃";


  choiceA.className =
    "choice choice-a";


  choiceB.className =
    "choice choice-b";


  revealBtn.disabled =
    true;


  revealBtn.style.display =
    "inline-block";


  nextBtn.style.display =
    "none";


  countdownStart();

}


/* =================================================
   COUNTDOWN
================================================= */

function countdownStart() {

  countdown.style.display =
    "flex";


  let n =
    3;


  countNumber.innerText =
    n;


  countdownInterval =
    setInterval(
      function() {

        n--;


        if (
          n > 0
        ) {

          countNumber.innerText =
            n;

        }

        else {

          clearInterval(
            countdownInterval
          );


          countNumber.innerText =
            "JUMP!";


          setTimeout(
            function() {

              countdown.style.display =
                "none";


              mulaiTimer();

            },
            700
          );

        }

      },
      700
    );

}


/* =================================================
   TIMER
================================================= */

function mulaiTimer() {

  let time =
    5;


  roundRunning =
    true;


  initAudio();


  startBGM();


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  timerInterval =
    setInterval(
      function() {

        time -=
          0.1;


        timerEl.innerText =
          Math.max(
            0,
            Math.ceil(time)
          );


        progressEl.style.width =
          Math.max(
            0,
            (time / 5) * 100
          ) + "%";


        if (
          time <= 0
        ) {

          clearInterval(
            timerInterval
          );


          roundRunning =
            false;


          stopBGM();


          timerEl.innerText =
            "⏰ WAKTU HABIS";


          progressEl.style.width =
            "0%";


          revealBtn.disabled =
            false;


          feedbackEl.innerHTML =
            "🏃 <b>WAKTU HABIS!</b><br>" +
            "Sekarang pilih A atau B sesuai posisi siswa.";

        }

      },
      100
    );

}


/* =================================================
   PILIH A
================================================= */

choiceA.addEventListener(
  "click",
  function() {

    if (
      revealed ||
      revealBtn.disabled
    ) {

      return;

    }


    selectedAnswer =
      "SENILAI";


    choiceA.classList.add(
      "selected"
    );


    choiceB.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅰️ Pilihan siswa: <b>SENILAI</b>";

  }
);


/* =================================================
   PILIH B
================================================= */

choiceB.addEventListener(
  "click",
  function() {

    if (
      revealed ||
      revealBtn.disabled
    ) {

      return;

    }


    selectedAnswer =
      "BERBALIK NILAI";


    choiceB.classList.add(
      "selected"
    );


    choiceA.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅱️ Pilihan siswa: <b>BERBALIK NILAI</b>";

  }
);


/* =================================================
   REVEAL
================================================= */

revealBtn.addEventListener(
  "click",
  function() {

    if (
      revealed
    ) {

      return;

    }


    if (
      !selectedAnswer
    ) {

      feedbackEl.innerHTML =
        "⚠️ Klik A atau B sesuai pilihan siswa.";

      return;

    }


    revealed =
      true;


    clearInterval(
      timerInterval
    );


    stopBGM();


    const q =
      questions[currentIndex];


    const benar =
      normalizeAnswer(
        selectedAnswer
      ) ===
      normalizeAnswer(
        q.jawaban
      );


    if (
      benar
    ) {

      score +=
        Number(q.poin) ||
        10;


      scoreEl.innerText =
        score;


      playYeay();


      if (
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "correct"
        );

        choiceB.classList.add(
          "dim"
        );

      }

      else {

        choiceB.classList.add(
          "correct"
        );

        choiceA.classList.add(
          "dim"
        );

      }


      feedbackEl.innerHTML =
        "🎉 <b>YEAY! BENAR!</b><br>" +
        "+" +
        (Number(q.poin) || 10) +
        " POIN<br><br>" +
        q.pembahasan;

    }


    else {

      playBoom();


      if (
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "wrong"
        );

        choiceB.classList.add(
          "correct"
        );

      }

      else {

        choiceB.classList.add(
          "wrong"
        );

        choiceA.classList.add(
          "correct"
        );

      }


      feedbackEl.innerHTML =
        "💥 <b>BOOM!</b><br>" +
        "Jawaban benar: <b>" +
        normalizeAnswer(
          q.jawaban
        ) +
        "</b><br><br>" +
        q.pembahasan;

    }


    revealBtn.style.display =
      "none";


    nextBtn.style.display =
      "inline-block";


    saveResult(
      q,
      selectedAnswer,
      benar
    );

  }
);


/* =================================================
   NORMALISASI JAWABAN
================================================= */

function normalizeAnswer(
  value
) {

  const text =
    String(value || "")
      .trim()
      .toUpperCase();


  if (
    text ===
    "BERBALIK" ||
    text ===
    "BERBALIK NILAI"
  ) {

    return "BERBALIK NILAI";

  }


  return "SENILAI";

}


/* =================================================
   SIMPAN HASIL
================================================= */

function saveResult(
  q,
  answer,
  benar
) {

  const callbackName =
    "ratioJumpSave_" +
    Date.now();


  window[callbackName] =
    function(result) {

      console.log(
        "Hasil tersimpan:",
        result
      );


      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    API_URL +

    "?api=save" +

    "&callback=" +
    callbackName +

    "&pemain=" +
    encodeURIComponent(
      "Kelas VII"
    ) +

    "&id=" +
    encodeURIComponent(
      q.id
    ) +

    "&jawaban=" +
    encodeURIComponent(
      answer
    ) +

    "&jawabanBenar=" +
    encodeURIComponent(
      normalizeAnswer(
        q.jawaban
      )
    ) +

    "&status=" +
    encodeURIComponent(
      benar
        ? "BENAR"
        : "SALAH"
    ) +

    "&skor=" +
    encodeURIComponent(
      benar
        ? Number(q.poin) || 10
        : 0
    ) +

    "&t=" +
    Date.now();


  script.async =
    true;


  document.body.appendChild(
    script
  );

}


/* =================================================
   NEXT
================================================= */

nextBtn.addEventListener(
  "click",
  function() {

    currentIndex++;


    if (
      currentIndex >=
      questions.length
    ) {

      finishGame();

      return;

    }


    showQuestion();

  }
);


/* =================================================
   FINISH
================================================= */

function finishGame() {

  clearInterval(
    timerInterval
  );


  clearInterval(
    countdownInterval
  );


  stopBGM();


  document.querySelector(
    ".header"
  ).style.display =
    "none";


  document.querySelector(
    ".question-box"
  ).style.display =
    "none";


  document.querySelector(
    ".timer-area"
  ).style.display =
    "none";


  document.querySelector(
    ".feedback"
  ).style.display =
    "none";


  document.querySelector(
    ".choice-a"
  ).style.display =
    "none";


  document.querySelector(
    ".choice-b"
  ).style.display =
    "none";


  document.querySelector(
    ".controls"
  ).style.display =
    "none";


  document.querySelector(
    ".fullscreen-btn"
  ).style.display =
    "none";


  finish.style.display =
    "flex";


  finalScore.innerText =
    score +
    " POIN";


  const maxScore =
    questions.reduce(
      function(
        total,
        q
      ) {

        return total +
          (
            Number(q.poin) ||
            10
          );

      },
      0
    );


  const accuracy =
    maxScore > 0
      ? Math.round(
          score /
          maxScore *
          100
        )
      : 0;


  if (
    accuracy >= 90
  ) {

    finalMessage.innerText =
      "🏆 RATIO MASTER! Luar biasa!";

  }

  else if (
    accuracy >= 75
  ) {

    finalMessage.innerText =
      "⭐ RATIO EXPERT! Mantap!";

  }

  else if (
    accuracy >= 60
  ) {

    finalMessage.innerText =
      "💪 RATIO EXPLORER! Terus berlatih!";

  }

  else {

    finalMessage.innerText =
      "🌱 Tetap semangat belajar!";

  }

}


/* =================================================
   RESTART
================================================= */

restartBtn.addEventListener(
  "click",
  function() {

    location.reload();

  }
);


playAgain.addEventListener(
  "click",
  function() {

    location.reload();

  }
);


/* =================================================
   START
================================================= */

loadQuestions();

</script>
