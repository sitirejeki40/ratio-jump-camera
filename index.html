<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RATIO JUMP</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #111;

}


/* =====================================================
   GAME UTAMA
===================================================== */

.game {

  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background: #111;

}


/* =====================================================
   KAMERA FULL SCREEN
===================================================== */

#video {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform:
    scaleX(-1);

  background: #000;

  z-index: 1;

}


/* =====================================================
   OVERLAY GELAP TIPIS
===================================================== */

.dark-overlay {

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.60),
      rgba(0,0,0,0.04) 28%,
      rgba(0,0,0,0.03) 68%,
      rgba(0,0,0,0.48)
    );

  pointer-events: none;

  z-index: 2;

}


/* =====================================================
   PEMBAGI 3 ZONA
===================================================== */

.zone-overlay {

  position: absolute;

  inset: 0;

  display: grid;

  grid-template-columns:
    42% 16% 42%;

  pointer-events: none;

  z-index: 3;

}


/* KIRI */

.zone-left {

  height: 100%;

  background:
    rgba(60,220,100,0.20);

  border-right:
    4px dashed
    rgba(255,255,255,0.90);

}


/* TENGAH */

.zone-center {

  position: relative;

  height: 100%;

  background:
    rgba(255,255,255,0.06);

}


/* KANAN */

.zone-right {

  height: 100%;

  background:
    rgba(240,70,70,0.20);

  border-left:
    4px dashed
    rgba(255,255,255,0.90);

}


/* LABEL STANDBY */

.standby-label {

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%,-50%)
    rotate(-90deg);

  padding:
    8px 13px;

  border-radius:
    10px;

  background:
    rgba(0,0,0,0.38);

  color: white;

  font-size: 18px;

  font-weight: 900;

  letter-spacing: 2px;

  text-shadow:
    2px 2px 6px rgba(0,0,0,0.8);

  white-space: nowrap;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  position: absolute;

  top: 14px;
  left: 18px;
  right: 18px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  z-index: 20;

  color: white;

  text-shadow:
    2px 2px 6px
    rgba(0,0,0,0.85);

}


.logo {

  font-size: 34px;

  font-weight: 900;

}


.info {

  display: flex;

  gap: 10px;

}


.info-box {

  background:
    rgba(0,0,0,0.58);

  padding:
    9px 15px;

  border-radius:
    13px;

  font-size: 19px;

  font-weight: 900;

}


/* =====================================================
   STATUS KAMERA
===================================================== */

.camera-status {

  position: absolute;

  top: 66px;
  left: 18px;

  z-index: 20;

  padding:
    7px 12px;

  border-radius:
    10px;

  background:
    rgba(0,0,0,0.58);

  color: white;

  font-size: 15px;

  font-weight: bold;

}


/* =====================================================
   PERTANYAAN
===================================================== */

.question-box {

  position: absolute;

  top: 105px;

  left: 50%;

  transform:
    translateX(-50%);

  width: 76%;

  max-width: 1100px;

  z-index: 20;

  background:
    rgba(255,255,255,0.95);

  color:
    #172033;

  padding:
    18px 26px;

  border-radius:
    20px;

  text-align:
    center;

  box-shadow:
    0 8px 24px
    rgba(0,0,0,0.25);

}


.question-label {

  font-size: 16px;

  font-weight: 900;

  margin-bottom: 7px;

}


.question {

  font-size: 28px;

  line-height: 1.3;

  font-weight: 900;

}


/* =====================================================
   TIMER
===================================================== */

.timer-area {

  position: absolute;

  top: 255px;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 20;

  text-align:
    center;

  color: white;

  text-shadow:
    2px 2px 7px
    rgba(0,0,0,0.9);

}


.timer {

  font-size: 48px;

  font-weight: 900;

}


.progress-bg {

  width: 420px;

  max-width: 55vw;

  height: 9px;

  background:
    rgba(255,255,255,0.38);

  border-radius: 20px;

  overflow: hidden;

}


.progress {

  width: 100%;

  height: 100%;

  background:
    #ffd447;

}


/* =====================================================
   PILIHAN A / B
===================================================== */

.choice {

  position: absolute;

  bottom: 28px;

  z-index: 30;

  width: 35%;

  max-width: 500px;

  min-height: 92px;

  border-radius: 20px;

  display: flex;

  justify-content:
    center;

  align-items:
    center;

  gap: 12px;

  font-size: 31px;

  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 8px 20px
    rgba(0,0,0,0.35);

  transition:
    transform 0.15s,
    filter 0.15s;

}


.choice:hover {

  transform:
    scale(1.03);

}


.choice-a {

  left: 3%;

  background:
    rgba(49,211,82,0.96);

  color:
    #08200d;

}


.choice-b {

  right: 3%;

  background:
    rgba(255,89,89,0.96);

  color:
    #3b0606;

}


.choice-tag {

  width: 54px;

  height: 54px;

  border-radius: 50%;

  background: white;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 28px;

}


.choice.selected {

  outline:
    7px solid white;

  transform:
    scale(1.05);

}


.choice.correct {

  background:
    #19e347 !important;

  color:
    #06220a;

}


.choice.wrong {

  background:
    #ff2525 !important;

  color: white;

}


.choice.dim {

  filter:
    brightness(0.45);

}


/* =====================================================
   FEEDBACK
===================================================== */

.feedback {

  position: absolute;

  left: 50%;

  bottom: 138px;

  transform:
    translateX(-50%);

  z-index: 35;

  width: 45%;

  max-width: 720px;

  min-height: 68px;

  background:
    rgba(255,255,255,0.95);

  color:
    #172033;

  padding:
    13px 20px;

  border-radius:
    18px;

  text-align:
    center;

  font-size: 19px;

  font-weight: bold;

  box-shadow:
    0 6px 16px
    rgba(0,0,0,0.20);

}


/* =====================================================
   KONTROL GURU
===================================================== */

.teacher-controls {

  position: absolute;

  bottom: 8px;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 40;

  display: flex;

  gap: 7px;

}


.control-btn {

  border: none;

  padding:
    7px 12px;

  border-radius:
    9px;

  font-size:
    14px;

  font-weight:
    bold;

  cursor:
    pointer;

}


.camera-btn {

  background:
    #4285f4;

  color:
    white;

}


.reveal {

  background:
    #ffd447;

}


.next {

  display:
    none;

  background:
    #4285f4;

  color:
    white;

}


.restart {

  background:
    #777;

  color:
    white;

}


/* =====================================================
   FULLSCREEN
===================================================== */

.fullscreen-btn {

  position: absolute;

  top: 65px;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 40;

  border: none;

  background:
    rgba(0,0,0,0.50);

  color: white;

  padding:
    6px 11px;

  border-radius:
    9px;

  font-size:
    13px;

  font-weight:
    bold;

  cursor:
    pointer;

}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown {

  position: absolute;

  inset: 0;

  z-index: 100;

  display: none;

  align-items:
    center;

  justify-content:
    center;

  background:
    rgba(10,20,35,0.68);

}


.count-number {

  color: white;

  font-size:
    180px;

  font-weight:
    900;

  text-shadow:
    0 8px 25px
    rgba(0,0,0,0.70);

}


/* =====================================================
   FINAL
===================================================== */

.finish {

  position: absolute;

  inset: 0;

  z-index: 200;

  display: none;

  align-items:
    center;

  justify-content:
    center;

  background:
    linear-gradient(
      135deg,
      #155b3a,
      #1c8c5a
    );

  color: white;

  text-align:
    center;

}


.finish-content {

  background:
    rgba(0,0,0,0.25);

  padding:
    50px;

  border-radius:
    30px;

}


.finish-title {

  font-size:
    48px;

  font-weight:
    900;

}


.final-score {

  font-size:
    82px;

  font-weight:
    900;

  margin:
    20px 0;

}


.play-again {

  border: none;

  padding:
    16px 30px;

  border-radius:
    15px;

  font-size:
    23px;

  font-weight:
    bold;

  cursor:
    pointer;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 900px) {

  .logo {
    font-size: 27px;
  }

  .question-box {
    width: 92%;
    top: 82px;
  }

  .question {
    font-size: 21px;
  }

  .choice {
    width: 38%;
    min-height: 80px;
    font-size: 22px;
  }

  .choice-tag {
    width: 43px;
    height: 43px;
    font-size: 22px;
  }

  .feedback {
    width: 65%;
    bottom: 120px;
    font-size: 16px;
  }

  .standby-label {
    font-size: 13px;
  }

}

</style>

</head>


<body>


<div class="game">


  <!-- ==========================================
       KAMERA
  =========================================== -->

  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <!-- OVERLAY GELAP -->

  <div class="dark-overlay"></div>


  <!-- ==========================================
       PEMBAGI 3 ZONA
  =========================================== -->

  <div class="zone-overlay">

    <div class="zone-left">
    </div>


    <div class="zone-center">

      <div class="standby-label">
        STANDBY
      </div>

    </div>


    <div class="zone-right">
    </div>

  </div>


  <!-- ==========================================
       HEADER
  =========================================== -->

  <div class="header">

    <div class="logo">
      🔎 RATIO JUMP
    </div>


    <div class="info">

      <div class="info-box">

        SOAL
        <span id="number">
          1
        </span>
        /
        <span id="total">
          0
        </span>

      </div>


      <div class="info-box">

        ⭐
        <span id="score">
          0
        </span>

      </div>

    </div>

  </div>


  <!-- ==========================================
       STATUS
  =========================================== -->

  <div
    id="cameraStatus"
    class="camera-status">

    🔴 KAMERA BELUM AKTIF

  </div>


  <!-- ==========================================
       QUESTION
  =========================================== -->

  <div class="question-box">

    <div class="question-label">

      🧠 BACA • PIKIRKAN • JUMP!

    </div>


    <div
      id="question"
      class="question">

      Memuat soal...

    </div>

  </div>


  <!-- ==========================================
       TIMER
  =========================================== -->

  <div class="timer-area">

    <div
      id="timer"
      class="timer">

      5

    </div>


    <div class="progress-bg">

      <div
        id="progress"
        class="progress">

      </div>

    </div>

  </div>


  <!-- ==========================================
       PILIHAN A
  ========================================== -->

  <div
    id="choiceA"
    class="choice choice-a">

    <div class="choice-tag">
      A
    </div>

    <div>
      SENILAI
    </div>

  </div>


  <!-- ==========================================
       PILIHAN B
  ========================================== -->

  <div
    id="choiceB"
    class="choice choice-b">

    <div class="choice-tag">
      B
    </div>

    <div>
      BERBALIK NILAI
    </div>

  </div>


  <!-- ==========================================
       FEEDBACK
  ========================================== -->

  <div
    id="feedback"
    class="feedback">

    Bersiap...

  </div>


  <!-- ==========================================
       KONTROL GURU
  ========================================== -->

  <div class="teacher-controls">

    <button
      id="cameraBtn"
      class="control-btn camera-btn">

      🎥 AKTIFKAN KAMERA

    </button>


    <button
      id="revealBtn"
      class="control-btn reveal">

      👀 LIHAT JAWABAN

    </button>


    <button
      id="nextBtn"
      class="control-btn next">

      ➡️ NEXT

    </button>


    <button
      id="restartBtn"
      class="control-btn restart">

      🔄 ULANGI

    </button>

  </div>


  <!-- ==========================================
       FULLSCREEN
  ========================================== -->

  <button
    id="fullscreenBtn"
    class="fullscreen-btn">

    ⛶ FULLSCREEN

  </button>


  <!-- ==========================================
       COUNTDOWN
  ========================================== -->

  <div
    id="countdown"
    class="countdown">

    <div
      id="countNumber"
      class="count-number">

      3

    </div>

  </div>


  <!-- ==========================================
       FINISH
  ========================================== -->

  <div
    id="finish"
    class="finish">

    <div class="finish-content">

      <div class="finish-title">

        🏆 RATIO JUMP SELESAI!

      </div>


      <div
        id="finalScore"
        class="final-score">

        0

      </div>


      <div
        id="finalMessage"
        style="
          font-size:28px;
          font-weight:bold;
        ">

      </div>


      <br>


      <button
        id="playAgain"
        class="play-again">

        🔄 MAIN LAGI

      </button>

    </div>

  </div>


</div>


<script>


/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbxoP3_605xuQQb3Rb0uwGPDNLHBq6Xdju3TYYIzom_XovINiPxofhUTeEF20_K8mDFb/exec";


/* =====================================================
   DATA
===================================================== */

let questions = [];

let currentIndex = 0;

let score = 0;

let selectedAnswer = null;

let revealed = false;

let timerInterval = null;

let countdownInterval = null;


/* =====================================================
   ELEMENT
===================================================== */

const video =
document.getElementById("video");

const cameraBtn =
document.getElementById("cameraBtn");

const cameraStatus =
document.getElementById("cameraStatus");

const questionEl =
document.getElementById("question");

const numberEl =
document.getElementById("number");

const totalEl =
document.getElementById("total");

const scoreEl =
document.getElementById("score");

const timerEl =
document.getElementById("timer");

const progressEl =
document.getElementById("progress");

const feedbackEl =
document.getElementById("feedback");

const choiceA =
document.getElementById("choiceA");

const choiceB =
document.getElementById("choiceB");

const revealBtn =
document.getElementById("revealBtn");

const nextBtn =
document.getElementById("nextBtn");

const restartBtn =
document.getElementById("restartBtn");

const countdown =
document.getElementById("countdown");

const countNumber =
document.getElementById("countNumber");

const finish =
document.getElementById("finish");

const finalScore =
document.getElementById("finalScore");

const finalMessage =
document.getElementById("finalMessage");

const playAgain =
document.getElementById("playAgain");

const fullscreenBtn =
document.getElementById("fullscreenBtn");


/* =====================================================
   KAMERA
===================================================== */

cameraBtn.addEventListener(
  "click",
  async function() {

    try {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Browser tidak mendukung kamera."
        );

      }


      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: true,

          audio: false

        });


      video.srcObject =
        stream;


      cameraStatus.innerHTML =
        "🟢 KAMERA LIVE";


      cameraBtn.innerText =
        "✅ KAMERA AKTIF";


      cameraBtn.disabled =
        true;

    }

    catch(error) {

      cameraStatus.innerHTML =
        "🔴 KAMERA GAGAL";


      alert(
        "Kamera tidak dapat dibuka.\n\n" +
        error.message
      );

    }

  }
);


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreenBtn.addEventListener(
  "click",
  function() {

    if (
      document.documentElement.requestFullscreen
    ) {

      document.documentElement
        .requestFullscreen();

    }

  }
);


/* =====================================================
   AMBIL SOAL
===================================================== */

function loadQuestions() {

  questionEl.innerText =
    "⏳ Mengambil soal...";


  window.receiveQuestions =
    function(data) {

      questions =
        Array.isArray(data)
          ? data
          : [];


      if (
        questions.length === 0
      ) {

        questionEl.innerText =
          "❌ Bank soal kosong.";

        return;

      }


      // Acak soal

      questions.sort(
        function() {
          return Math.random() - 0.5;
        }
      );


      totalEl.innerText =
        questions.length;


      showQuestion();

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?api=questions" +
    "&callback=receiveQuestions" +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      questionEl.innerText =
        "❌ Gagal mengambil soal.";

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   TAMPILKAN SOAL
===================================================== */

function showQuestion() {

  clearInterval(
    timerInterval
  );

  clearInterval(
    countdownInterval
  );


  selectedAnswer =
    null;

  revealed =
    false;


  const q =
    questions[currentIndex];


  numberEl.innerText =
    currentIndex + 1;


  questionEl.innerText =
    q.soal;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  feedbackEl.innerHTML =
    "Bersiap... 🏃";


  choiceA.className =
    "choice choice-a";


  choiceB.className =
    "choice choice-b";


  revealBtn.style.display =
    "inline-block";


  nextBtn.style.display =
    "none";


  mulaiCountdown();

}


/* =====================================================
   COUNTDOWN
===================================================== */

function mulaiCountdown() {

  countdown.style.display =
    "flex";


  let n =
    3;


  countNumber.innerText =
    n;


  countdownInterval =
    setInterval(
      function() {

        n--;


        if(n > 0) {

          countNumber.innerText =
            n;

        }

        else {

          clearInterval(
            countdownInterval
          );


          countNumber.innerText =
            "JUMP!";


          setTimeout(
            function() {

              countdown.style.display =
                "none";

              mulaiTimer();

            },
            700
          );

        }

      },
      700
    );

}


/* =====================================================
   TIMER
===================================================== */

function mulaiTimer() {

  let t =
    5;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  timerInterval =
    setInterval(
      function() {

        t -= 0.1;


        timerEl.innerText =
          Math.max(
            0,
            Math.ceil(t)
          );


        progressEl.style.width =
          Math.max(
            0,
            (t / 5) * 100
          ) + "%";


        if(t <= 0) {

          clearInterval(
            timerInterval
          );


          timerEl.innerText =
            "⏰ WAKTU HABIS";


          feedbackEl.innerHTML =
            "🏃 Anak-anak sudah memilih sisi!<br>" +
            "Bu Laily pilih <b>A</b> atau <b>B</b>.";

        }

      },
      100
    );

}


/* =====================================================
   PILIH A
===================================================== */

choiceA.addEventListener(
  "click",
  function() {

    if(revealed) return;


    selectedAnswer =
      "SENILAI";


    choiceA.classList.add(
      "selected"
    );


    choiceB.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅰️ Pilihan siswa: <b>SENILAI</b>";

  }
);


/* =====================================================
   PILIH B
===================================================== */

choiceB.addEventListener(
  "click",
  function() {

    if(revealed) return;


    selectedAnswer =
      "BERBALIK NILAI";


    choiceB.classList.add(
      "selected"
    );


    choiceA.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅱️ Pilihan siswa: <b>BERBALIK NILAI</b>";

  }
);


/* =====================================================
   LIHAT JAWABAN
===================================================== */

revealBtn.addEventListener(
  "click",
  function() {

    if(revealed) return;


    if(!selectedAnswer) {

      feedbackEl.innerHTML =
        "⚠️ Bu Laily pilih A atau B terlebih dahulu.";

      return;

    }


    revealed =
      true;


    clearInterval(
      timerInterval
    );


    const q =
      questions[currentIndex];


    const benar =
      selectedAnswer ===
      q.jawaban;


    /* ==============================
       JAWABAN BENAR
    ============================== */

    if(benar) {

      score +=
        Number(q.poin) || 10;


      scoreEl.innerText =
        score;


      if(
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "correct"
        );

        choiceB.classList.add(
          "dim"
        );

      }

      else {

        choiceB.classList.add(
          "correct"
        );

        choiceA.classList.add(
          "dim"
        );

      }


      feedbackEl.innerHTML =
        "🎉 <b>BENAR!</b><br>" +
        "+" +
        (Number(q.poin) || 10) +
        " POIN<br><br>" +
        q.pembahasan;

    }


    /* ==============================
       JAWABAN SALAH
    ============================== */

    else {

      if(
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "wrong"
        );

        choiceB.classList.add(
          "correct"
        );

      }

      else {

        choiceB.classList.add(
          "wrong"
        );

        choiceA.classList.add(
          "correct"
        );

      }


      feedbackEl.innerHTML =
        "😅 <b>BELUM TEPAT</b><br>" +
        "Jawaban benar: <b>" +
        q.jawaban +
        "</b><br><br>" +
        q.pembahasan;

    }


    revealBtn.style.display =
      "none";


    nextBtn.style.display =
      "inline-block";


    saveResult(
      q,
      selectedAnswer,
      benar
    );

  }
);


/* =====================================================
   SIMPAN HASIL
===================================================== */

function saveResult(
  q,
  answer,
  benar
) {

  window.saveAck =
    function(result) {

      console.log(
        "Hasil tersimpan:",
        result
      );

    };


  const url =

    API_URL +

    "?api=save" +

    "&callback=saveAck" +

    "&pemain=" +
    encodeURIComponent(
      "Kelas VII"
    ) +

    "&id=" +
    encodeURIComponent(
      q.id
    ) +

    "&jawaban=" +
    encodeURIComponent(
      answer
    ) +

    "&jawabanBenar=" +
    encodeURIComponent(
      q.jawaban
    ) +

    "&status=" +
    encodeURIComponent(
      benar
        ? "BENAR"
        : "SALAH"
    ) +

    "&skor=" +
    encodeURIComponent(
      benar
        ? Number(q.poin) || 10
        : 0
    );


  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  document.body.appendChild(
    script
  );

}


/* =====================================================
   NEXT
===================================================== */

nextBtn.addEventListener(
  "click",
  function() {

    currentIndex++;


    if(
      currentIndex >=
      questions.length
    ) {

      finishGame();

      return;

    }


    showQuestion();

  }
);


/* =====================================================
   FINISH
===================================================== */

function finishGame() {

  clearInterval(
    timerInterval
  );


  finish.style.display =
    "flex";


  finalScore.innerText =
    score +
    " POIN";


  const max =
    questions.reduce(
      function(total, q) {

        return total +
          (Number(q.poin) || 10);

      },
      0
    );


  const accuracy =
    max > 0
      ? Math.round(
          score /
          max *
          100
        )
      : 0;


  if(
    accuracy >= 90
  ) {

    finalMessage.innerText =
      "🏆 RATIO MASTER!";

  }

  else if(
    accuracy >= 75
  ) {

    finalMessage.innerText =
      "⭐ RATIO EXPERT!";

  }

  else if(
    accuracy >= 60
  ) {

    finalMessage.innerText =
      "💪 RATIO EXPLORER!";

  }

  else {

    finalMessage.innerText =
      "🌱 TERUS BERLATIH!";

  }

}


/* =====================================================
   RESTART
===================================================== */

restartBtn.addEventListener(
  "click",
  function() {

    location.reload();

  }
);


playAgain.addEventListener(
  "click",
  function() {

    location.reload();

  }
);


/* =====================================================
   START
===================================================== */

loadQuestions();

</script>
