<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RATIO JUMP</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #111;
}


/* =========================================
   LAYOUT UTAMA
========================================= */

.game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #111;
}


/* =========================================
   KAMERA FULL SCREEN
========================================= */

#video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  /* mirror seperti kamera HP/laptop */
  transform: scaleX(-1);

  background: #000;
}


/* sedikit overlay supaya tulisan terbaca */

.dark-overlay {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.65),
      rgba(0,0,0,0.08) 30%,
      rgba(0,0,0,0.05) 65%,
      rgba(0,0,0,0.55)
    );

  pointer-events: none;
}


/* =========================================
   HEADER
========================================= */

.header {

  position: absolute;

  top: 15px;
  left: 20px;
  right: 20px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  z-index: 10;

  color: white;

  text-shadow:
    2px 2px 6px rgba(0,0,0,0.8);
}

.logo {

  font-size: 34px;

  font-weight: 900;
}

.info {

  display: flex;

  gap: 10px;
}

.info-box {

  background:
    rgba(0,0,0,0.55);

  padding: 9px 16px;

  border-radius: 14px;

  font-size: 20px;

  font-weight: 900;
}


/* =========================================
   CAMERA STATUS
========================================= */

.camera-status {

  position: absolute;

  top: 75px;
  left: 20px;

  z-index: 10;

  background:
    rgba(0,0,0,0.55);

  color: white;

  padding: 8px 14px;

  border-radius: 12px;

  font-size: 16px;

  font-weight: bold;
}


/* =========================================
   PERTANYAAN
========================================= */

.question-box {

  position: absolute;

  top: 100px;

  left: 50%;

  transform: translateX(-50%);

  width: 82%;

  max-width: 1200px;

  z-index: 10;

  background:
    rgba(255,255,255,0.94);

  color: #172033;

  padding: 20px 30px;

  border-radius: 22px;

  text-align: center;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.25);

}

.question-label {

  font-size: 17px;

  font-weight: 900;

  margin-bottom: 8px;
}

.question {

  font-size: 30px;

  line-height: 1.3;

  font-weight: 900;
}


/* =========================================
   TIMER
========================================= */

.timer-area {

  position: absolute;

  top: 265px;

  left: 50%;

  transform: translateX(-50%);

  z-index: 10;

  text-align: center;

  color: white;

  text-shadow:
    2px 2px 6px rgba(0,0,0,0.9);
}

.timer {

  font-size: 52px;

  font-weight: 900;
}

.progress-bg {

  width: 500px;

  max-width: 65vw;

  height: 10px;

  background:
    rgba(255,255,255,0.4);

  border-radius: 20px;

  overflow: hidden;
}

.progress {

  width: 100%;

  height: 100%;

  background: #ffd447;
}


/* =========================================
   PILIHAN A / B
========================================= */

.choice {

  position: absolute;

  bottom: 30px;

  z-index: 15;

  width: 40%;

  max-width: 560px;

  min-height: 130px;

  border-radius: 25px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 15px;

  font-size: 38px;

  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 10px 25px rgba(0,0,0,0.3);

  transition:
    transform 0.15s,
    filter 0.15s;
}

.choice:hover {

  transform: scale(1.03);
}

.choice-a {

  left: 3%;

  background:
    rgba(77, 220, 100, 0.95);

  color: #08200d;
}

.choice-b {

  right: 3%;

  background:
    rgba(255, 97, 97, 0.95);

  color: #380606;
}

.choice-tag {

  width: 70px;

  height: 70px;

  border-radius: 50%;

  background: rgba(255,255,255,0.95);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 38px;

  font-weight: 900;
}

.choice.selected {

  outline:
    8px solid white;

  transform:
    scale(1.05);

}

.choice.correct {

  background:
    #25d94b !important;

  color: #062b0d;

}

.choice.wrong {

  background:
    #ff3535 !important;

  color: white;

}

.choice.dim {

  filter: brightness(0.55);

}


/* =========================================
   FEEDBACK
========================================= */

.feedback {

  position: absolute;

  left: 50%;

  bottom: 185px;

  transform:
    translateX(-50%);

  z-index: 20;

  width: 65%;

  max-width: 850px;

  min-height: 80px;

  background:
    rgba(255,255,255,0.95);

  border-radius: 20px;

  padding: 16px 25px;

  text-align: center;

  font-size: 22px;

  font-weight: bold;

  color: #172033;

}


/* =========================================
   TOMBOL KONTROL GURU
========================================= */

.teacher-controls {

  position: absolute;

  bottom: 8px;

  left: 50%;

  transform: translateX(-50%);

  z-index: 25;

  display: flex;

  gap: 8px;

}

.control-btn {

  border: none;

  padding: 8px 14px;

  border-radius: 10px;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

}

.reveal {

  background: #ffd447;

}

.next {

  background: #4285f4;

  color: white;

  display: none;
}

.camera-btn {

  background: #4285f4;

  color: white;

}


/* =========================================
   COUNTDOWN
========================================= */

.countdown {

  position: absolute;

  inset: 0;

  z-index: 100;

  display: none;

  align-items: center;

  justify-content: center;

  background:
    rgba(10,20,35,0.68);

}

.count-number {

  color: white;

  font-size: 170px;

  font-weight: 900;

  text-shadow:
    0 8px 25px rgba(0,0,0,0.7);

}


/* =========================================
   FINAL
========================================= */

.finish {

  position: absolute;

  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;

  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #155b3a,
      #1c8c5a
    );

  color: white;

  text-align: center;

}

.finish-content {

  background:
    rgba(0,0,0,0.25);

  padding: 50px;

  border-radius: 30px;

}

.finish-title {

  font-size: 50px;

  font-weight: 900;

}

.final-score {

  font-size: 85px;

  font-weight: 900;

  margin: 20px 0;
}

.play-again {

  border: none;

  padding: 18px 35px;

  border-radius: 15px;

  font-size: 25px;

  font-weight: bold;

  cursor: pointer;

}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px) {

  .logo {
    font-size: 28px;
  }

  .question-box {
    width: 94%;
    top: 85px;
  }

  .question {
    font-size: 23px;
  }

  .choice {
    width: 43%;
    min-height: 95px;
    font-size: 24px;
  }

  .choice-tag {
    width: 50px;
    height: 50px;
    font-size: 25px;
  }

  .feedback {
    width: 85%;
    bottom: 145px;
    font-size: 18px;
  }

}


/* =========================================
   FULLSCREEN
========================================= */

.fullscreen-btn {

  position: absolute;

  top: 18px;
  left: 50%;

  transform:
    translateX(-50%);

  z-index: 30;

  border: none;

  background:
    rgba(0,0,0,0.55);

  color: white;

  padding: 8px 14px;

  border-radius: 10px;

  cursor: pointer;

  font-weight: bold;
}

</style>

</head>


<body>

<div class="game">


  <!-- ====================================
       VIDEO KAMERA
  ===================================== -->

  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <div class="dark-overlay"></div>


  <!-- ====================================
       HEADER
  ===================================== -->

  <div class="header">

    <div class="logo">

      🔎 RATIO JUMP

    </div>


    <div class="info">

      <div class="info-box">

        SOAL
        <span id="number">1</span>
        /
        <span id="total">0</span>

      </div>


      <div class="info-box">

        ⭐
        <span id="score">0</span>

      </div>

    </div>

  </div>


  <!-- ====================================
       CAMERA STATUS
  ===================================== -->

  <div
    id="cameraStatus"
    class="camera-status">

    🔴 Kamera belum aktif

  </div>


  <!-- ====================================
       QUESTION
  ===================================== -->

  <div class="question-box">

    <div class="question-label">

      🧠 BACA • PIKIRKAN • JUMP!

    </div>


    <div
      id="question"
      class="question">

      Memuat soal...

    </div>

  </div>


  <!-- ====================================
       TIMER
  ===================================== -->

  <div class="timer-area">

    <div
      id="timer"
      class="timer">

      5

    </div>


    <div class="progress-bg">

      <div
        id="progress"
        class="progress">
      </div>

    </div>

  </div>


  <!-- ====================================
       PILIHAN A
  ===================================== -->

  <div
    id="choiceA"
    class="choice choice-a">

    <div class="choice-tag">
      A
    </div>

    <div>
      SENILAI
    </div>

  </div>


  <!-- ====================================
       PILIHAN B
  ===================================== -->

  <div
    id="choiceB"
    class="choice choice-b">

    <div class="choice-tag">
      B
    </div>

    <div>
      BERBALIK NILAI
    </div>

  </div>


  <!-- ====================================
       FEEDBACK
  ===================================== -->

  <div
    id="feedback"
    class="feedback">

    Bersiap...

  </div>


  <!-- ====================================
       KONTROL GURU
  ===================================== -->

  <div class="teacher-controls">

    <button
      id="cameraBtn"
      class="control-btn camera-btn">

      🎥 AKTIFKAN KAMERA

    </button>


    <button
      id="revealBtn"
      class="control-btn reveal">

      👀 LIHAT JAWABAN

    </button>


    <button
      id="nextBtn"
      class="control-btn next">

      ➡️ NEXT

    </button>


    <button
      id="restartBtn"
      class="control-btn">

      🔄 ULANGI

    </button>

  </div>


  <!-- ====================================
       FULLSCREEN
  ===================================== -->

  <button
    id="fullscreenBtn"
    class="fullscreen-btn">

    ⛶ FULLSCREEN

  </button>


  <!-- ====================================
       COUNTDOWN
  ===================================== -->

  <div
    id="countdown"
    class="countdown">

    <div
      id="countNumber"
      class="count-number">

      3

    </div>

  </div>


  <!-- ====================================
       FINISH
  ===================================== -->

  <div
    id="finish"
    class="finish">

    <div class="finish-content">

      <div class="finish-title">

        🏆 RATIO JUMP SELESAI!

      </div>


      <div
        id="finalScore"
        class="final-score">

        0

      </div>


      <div
        id="finalMessage"
        style="
          font-size:28px;
          font-weight:bold;
        ">

      </div>


      <br>


      <button
        id="playAgain"
        class="play-again">

        🔄 MAIN LAGI

      </button>

    </div>

  </div>


</div>


<script>


/* =========================================
   URL APPS SCRIPT
========================================= */

const API_URL =
"https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbxoP3_605xuQQb3Rb0uwGPDNLHBq6Xdju3TYYIzom_XovINiPxofhUTeEF20_K8mDFb/exec";


/* =========================================
   DATA
========================================= */

let questions = [];

let currentIndex = 0;

let score = 0;

let selectedAnswer = null;

let revealed = false;

let timerInterval = null;


/* =========================================
   ELEMENT
========================================= */

const video =
document.getElementById("video");

const cameraBtn =
document.getElementById("cameraBtn");

const cameraStatus =
document.getElementById("cameraStatus");

const questionEl =
document.getElementById("question");

const numberEl =
document.getElementById("number");

const totalEl =
document.getElementById("total");

const scoreEl =
document.getElementById("score");

const timerEl =
document.getElementById("timer");

const progressEl =
document.getElementById("progress");

const feedbackEl =
document.getElementById("feedback");

const choiceA =
document.getElementById("choiceA");

const choiceB =
document.getElementById("choiceB");

const revealBtn =
document.getElementById("revealBtn");

const nextBtn =
document.getElementById("nextBtn");

const restartBtn =
document.getElementById("restartBtn");

const countdown =
document.getElementById("countdown");

const countNumber =
document.getElementById("countNumber");

const finish =
document.getElementById("finish");

const finalScore =
document.getElementById("finalScore");

const finalMessage =
document.getElementById("finalMessage");

const playAgain =
document.getElementById("playAgain");

const fullscreenBtn =
document.getElementById("fullscreenBtn");


/* =========================================
   AKTIFKAN KAMERA
========================================= */

cameraBtn.addEventListener(
  "click",
  async function() {

    try {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Browser tidak mendukung kamera."
        );

      }


      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: true,

          audio: false

        });


      video.srcObject =
        stream;


      cameraStatus.innerHTML =
        "🟢 KAMERA LIVE";


      cameraBtn.innerText =
        "✅ KAMERA AKTIF";


      cameraBtn.disabled =
        true;

    }

    catch(error) {

      cameraStatus.innerHTML =
        "🔴 Kamera tidak dapat diakses";


      alert(
        "Kamera tidak dapat dibuka.\n\n" +
        error.message
      );

    }

  }
);


/* =========================================
   FULLSCREEN
========================================= */

fullscreenBtn.addEventListener(
  "click",
  function() {

    if (
      document.documentElement.requestFullscreen
    ) {

      document.documentElement
        .requestFullscreen();

    }

  }
);


/* =========================================
   AMBIL SOAL DARI SPREADSHEET
========================================= */

function loadQuestions() {

  questionEl.innerText =
    "⏳ Mengambil soal...";


  window.receiveQuestions =
    function(data) {

      questions =
        Array.isArray(data)
          ? data
          : [];


      if (
        questions.length === 0
      ) {

        questionEl.innerText =
          "❌ Bank soal kosong.";

        return;

      }


      // Acak soal

      questions.sort(
        () =>
          Math.random() - 0.5
      );


      totalEl.innerText =
        questions.length;


      showQuestion();

    };


  window.questionError =
    function(error) {

      console.error(error);

      questionEl.innerText =
        "❌ Gagal mengambil soal.";

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?api=questions" +
    "&callback=receiveQuestions" +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      questionEl.innerText =
        "❌ Koneksi ke Spreadsheet gagal.";

    };


  document.body.appendChild(
    script
  );

}


/* =========================================
   TAMPILKAN SOAL
========================================= */

function showQuestion() {

  clearInterval(
    timerInterval
  );


  const q =
    questions[currentIndex];


  selectedAnswer =
    null;


  revealed =
    false;


  numberEl.innerText =
    currentIndex + 1;


  questionEl.innerText =
    q.soal;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  feedbackEl.innerHTML =
    "Bersiap untuk <b>JUMP!</b> 🏃";


  choiceA.className =
    "choice choice-a";


  choiceB.className =
    "choice choice-b";


  revealBtn.style.display =
    "inline-block";


  nextBtn.style.display =
    "none";


  mulaiCountdown();

}


/* =========================================
   COUNTDOWN
========================================= */

function mulaiCountdown() {

  countdown.style.display =
    "flex";


  let n =
    3;


  countNumber.innerText =
    n;


  const interval =
    setInterval(
      function() {

        n--;


        if(n > 0) {

          countNumber.innerText =
            n;

        }

        else {

          clearInterval(
            interval
          );


          countNumber.innerText =
            "JUMP!";


          setTimeout(
            function() {

              countdown.style.display =
                "none";

              mulaiTimer();

            },
            700
          );

        }

      },
      700
    );

}


/* =========================================
   TIMER
========================================= */

function mulaiTimer() {

  let t =
    5;


  timerEl.innerText =
    "5";


  progressEl.style.width =
    "100%";


  timerInterval =
    setInterval(
      function() {

        t -= 0.1;


        timerEl.innerText =
          Math.max(
            0,
            Math.ceil(t)
          );


        progressEl.style.width =
          Math.max(
            0,
            (t / 5) * 100
          ) + "%";


        if(t <= 0) {

          clearInterval(
            timerInterval
          );


          timerEl.innerText =
            "⏰ WAKTU HABIS";


          feedbackEl.innerHTML =
            "🏃 <b>Anak-anak sudah memilih!</b><br>" +
            "Klik A atau B sesuai posisi mereka.";

        }

      },
      100
    );

}


/* =========================================
   PILIH A
========================================= */

choiceA.addEventListener(
  "click",
  function() {

    if(revealed) return;


    selectedAnswer =
      "SENILAI";


    choiceA.classList.add(
      "selected"
    );


    choiceB.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅰️ Pilihan siswa: <b>SENILAI</b>";

  }
);


/* =========================================
   PILIH B
========================================= */

choiceB.addEventListener(
  "click",
  function() {

    if(revealed) return;


    selectedAnswer =
      "BERBALIK NILAI";


    choiceB.classList.add(
      "selected"
    );


    choiceA.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🅱️ Pilihan siswa: <b>BERBALIK NILAI</b>";

  }
);


/* =========================================
   LIHAT JAWABAN
========================================= */

revealBtn.addEventListener(
  "click",
  function() {

    if(revealed) return;


    if(!selectedAnswer) {

      feedbackEl.innerHTML =
        "⚠️ Pilih A atau B sesuai posisi siswa terlebih dahulu.";

      return;

    }


    clearInterval(
      timerInterval
    );


    revealed =
      true;


    const q =
      questions[currentIndex];


    const benar =
      selectedAnswer ===
      q.jawaban;


    /* ==========================
       BENAR
    ========================== */

    if(benar) {

      score +=
        Number(q.poin) || 10;


      scoreEl.innerText =
        score;


      if(
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "correct"
        );

        choiceB.classList.add(
          "dim"
        );

      }

      else {

        choiceB.classList.add(
          "correct"
        );

        choiceA.classList.add(
          "dim"
        );

      }


      feedbackEl.innerHTML =
        "🎉 <b>BENAR!</b><br>" +
        "+" +
        (Number(q.poin) || 10) +
        " POIN<br><br>" +
        q.pembahasan;

    }


    /* ==========================
       SALAH
    ========================== */

    else {

      if(
        selectedAnswer ===
        "SENILAI"
      ) {

        choiceA.classList.add(
          "wrong"
        );

        choiceB.classList.add(
          "correct"
        );

      }

      else {

        choiceB.classList.add(
          "wrong"
        );

        choiceA.classList.add(
          "correct"
        );

      }


      feedbackEl.innerHTML =
        "😅 <b>BELUM TEPAT</b><br>" +
        "Jawaban benar: <b>" +
        q.jawaban +
        "</b><br><br>" +
        q.pembahasan;

    }


    revealBtn.style.display =
      "none";


    nextBtn.style.display =
      "inline-block";


    saveResult(
      q,
      selectedAnswer,
      benar
    );

  }
);


/* =========================================
   SIMPAN HASIL
========================================= */

function saveResult(
  q,
  answer,
  benar
) {

  window.saveAck =
    function(result) {

      console.log(
        "Hasil tersimpan",
        result
      );

    };


  const url =

    API_URL +

    "?api=save" +

    "&callback=saveAck" +

    "&pemain=" +
    encodeURIComponent(
      "Kelas VII"
    ) +

    "&id=" +
    encodeURIComponent(
      q.id
    ) +

    "&jawaban=" +
    encodeURIComponent(
      answer
    ) +

    "&jawabanBenar=" +
    encodeURIComponent(
      q.jawaban
    ) +

    "&status=" +
    encodeURIComponent(
      benar
        ? "BENAR"
        : "SALAH"
    ) +

    "&skor=" +
    encodeURIComponent(
      benar
        ? Number(q.poin) || 10
        : 0
    );


  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  document.body.appendChild(
    script
  );

}


/* =========================================
   NEXT
========================================= */

nextBtn.addEventListener(
  "click",
  function() {

    currentIndex++;


    if(
      currentIndex >=
      questions.length
    ) {

      finishGame();

      return;

    }


    showQuestion();

  }
);


/* =========================================
   FINISH
========================================= */

function finishGame() {

  clearInterval(
    timerInterval
  );


  finish.style.display =
    "flex";


  finalScore.innerText =
    score +
    " POIN";


  const max =
    questions.reduce(
      function(total, q) {

        return total +
          (Number(q.poin) || 10);

      },
      0
    );


  const accuracy =
    max > 0
      ? Math.round(
          score /
          max *
          100
        )
      : 0;


  if(
    accuracy >= 90
  ) {

    finalMessage.innerText =
      "🏆 RATIO MASTER!";

  }

  else if(
    accuracy >= 75
  ) {

    finalMessage.innerText =
      "⭐ RATIO EXPERT!";

  }

  else if(
    accuracy >= 60
  ) {

    finalMessage.innerText =
      "💪 RATIO EXPLORER!";

  }

  else {

    finalMessage.innerText =
      "🌱 TERUS BERLATIH!";

  }

}


/* =========================================
   RESTART
========================================= */

function restartGame() {

  location.reload();

}


restartBtn.addEventListener(
  "click",
  restartGame
);


playAgain.addEventListener(
  "click",
  restartGame
);


/* =========================================
   START
========================================= */

loadQuestions();
