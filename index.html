<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RATIO JUMP</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #eef4f8;

  color: #1f2937;

}

.app {

  width: 100%;

  max-width: 1600px;

  margin: auto;

  padding: 20px;

}


/* =============================
HEADER
============================= */

.header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  margin-bottom: 15px;

}

.title {

  font-size: 42px;

  font-weight: 900;

}

.info {

  display: flex;

  gap: 10px;

}

.badge {

  background: white;

  padding: 10px 18px;

  border-radius: 14px;

  font-size: 22px;

  font-weight: bold;

}


/* =============================
MAIN
============================= */

.main {

  display: grid;

  grid-template-columns:
    28% 44% 28%;

  gap: 15px;

}


/* =============================
CHOICE AREA
============================= */

.choice {

  min-height: 500px;

  border-radius: 28px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 20px;

  font-size: 44px;

  font-weight: 900;

  cursor: pointer;

  transition: .2s;

}

.choice:hover {

  transform: scale(1.02);

}

.left {

  background: #baf2c0;

}

.right {

  background: #ffb5b5;

}

.choice.selected {

  outline:
    8px solid #111827;

  transform:
    scale(1.03);

}

.choice.correct {

  background:
    #42d95c !important;

}

.choice.wrong {

  background:
    #ff5a5a !important;

}


/* =============================
CENTER
============================= */

.center {

  display: flex;

  flex-direction: column;

  gap: 15px;

}


/* CAMERA */

.camera {

  position: relative;

  background: black;

  border-radius: 24px;

  overflow: hidden;

  min-height: 230px;

}

video {

  width: 100%;

  display: block;

  transform:
    scaleX(-1);

}

.camera-label {

  position: absolute;

  top: 10px;

  left: 10px;

  background:
    rgba(0,0,0,.65);

  color: white;

  padding: 8px 12px;

  border-radius: 10px;

  font-weight: bold;

}


/* QUESTION */

.question {

  background: white;

  border-radius: 24px;

  padding: 30px;

  min-height: 220px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  font-size: 31px;

  font-weight: 800;

}


/* =============================
TIMER
============================= */

.timer {

  text-align: center;

  font-size: 42px;

  font-weight: 900;

}

.progress-bg {

  height: 12px;

  background: #d8e0e8;

  border-radius: 20px;

  overflow: hidden;

}

.progress {

  height: 100%;

  width: 100%;

  background: #4285f4;

}


/* =============================
BUTTON
============================= */

.actions {

  display: flex;

  justify-content: center;

  gap: 10px;

  flex-wrap: wrap;

}

button {

  border: none;

  border-radius: 15px;

  padding: 16px 25px;

  font-size: 22px;

  font-weight: bold;

  cursor: pointer;

}

.cameraBtn {

  background: #4285f4;

  color: white;

}

.reveal {

  background: #f2c94c;

}

.next {

  display: none;

  background: #4285f4;

  color: white;

}

.restart {

  background: #777;

  color: white;

}


/* =============================
FEEDBACK
============================= */

.feedback {

  background: white;

  border-radius: 20px;

  padding: 18px;

  min-height: 100px;

  text-align: center;

  font-size: 24px;

  font-weight: bold;

}


/* =============================
COUNTDOWN
============================= */

.overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(15,23,42,.88);

  display: none;

  align-items: center;

  justify-content: center;

  z-index: 100;

}

.count {

  color: white;

  font-size: 140px;

  font-weight: 900;

}


/* =============================
FINISH
============================= */

.finish {

  display: none;

  background: white;

  border-radius: 30px;

  padding: 50px;

  text-align: center;

}

.finish h2 {

  font-size: 50px;

}

.final-score {

  font-size: 80px;

  font-weight: 900;

}


/* =============================
RESPONSIVE
============================= */

@media(max-width: 1000px) {

  .main {

    grid-template-columns:
      1fr;

  }

  .choice {

    min-height: 180px;

  }

  .title {

    font-size: 32px;

  }

}

</style>

</head>


<body>

<div class="app">


  <!-- HEADER -->

  <div class="header">

    <div class="title">

      🔎 RATIO JUMP

    </div>


    <div class="info">

      <div class="badge">

        SOAL
        <span id="number">1</span>
        /
        <span id="total">0</span>

      </div>


      <div class="badge">

        ⭐
        <span id="score">0</span>

      </div>

    </div>

  </div>


  <!-- MAIN -->

  <div id="game">


    <div class="main">


      <!-- LEFT -->

      <div
        id="leftChoice"
        class="choice left">

        🟢<br>

        SENILAI

        <br>

        <small>
          LOMPAT KE KIRI
        </small>

      </div>


      <!-- CENTER -->

      <div class="center">


        <!-- CAMERA -->

        <div class="camera">

          <video
            id="video"
            autoplay
            playsinline>
          </video>

          <div class="camera-label">

            📷 CAMERA LIVE

          </div>

        </div>


        <button
          id="cameraBtn"
          class="cameraBtn">

          🎥 AKTIFKAN KAMERA

        </button>


        <!-- QUESTION -->

        <div
          id="question"
          class="question">

          Memuat soal...

        </div>


        <!-- TIMER -->

        <div
          id="timer"
          class="timer">

          3

        </div>


        <div class="progress-bg">

          <div
            id="progress"
            class="progress">
          </div>

        </div>


        <!-- FEEDBACK -->

        <div
          id="feedback"
          class="feedback">

          Bersiap...

        </div>


        <!-- ACTIONS -->

        <div class="actions">

          <button
            id="revealBtn"
            class="reveal">

            👀 LIHAT JAWABAN

          </button>


          <button
            id="nextBtn"
            class="next">

            SOAL BERIKUTNYA ➡️

          </button>


          <button
            id="restartBtn"
            class="restart">

            🔄 ULANGI

          </button>

        </div>


      </div>


      <!-- RIGHT -->

      <div
        id="rightChoice"
        class="choice right">

        🔴<br>

        BERBALIK NILAI

        <br>

        <small>
          LOMPAT KE KANAN
        </small>

      </div>


    </div>


  </div>


  <!-- FINISH -->

  <div
    id="finish"
    class="finish">

    <h2>

      🏆 RATIO JUMP SELESAI!

    </h2>


    <div
      id="finalScore"
      class="final-score">

      0

    </div>


    <p
      id="finalMessage"
      style="font-size:28px;font-weight:bold;">
    </p>


    <button
      id="restartFinal"
      class="restart">

      🔄 MAIN LAGI

    </button>

  </div>


</div>


<!-- COUNTDOWN -->

<div
  id="overlay"
  class="overlay">

  <div
    id="count"
    class="count">

    3

  </div>

</div>


<script>

/* ======================================
CONFIG
====================================== */

const API_URL =
"https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbxoP3_605xuQQb3Rb0uwGPDNLHBq6Xdju3TYYIzom_XovINiPxofhUTeEF20_K8mDFb/exec";


/* ======================================
DATA
====================================== */

let questions = [];

let currentIndex = 0;

let score = 0;

let selectedAnswer = null;

let revealed = false;

let timerInterval = null;


/* ======================================
ELEMENT
====================================== */

const questionEl =
document.getElementById("question");

const numberEl =
document.getElementById("number");

const totalEl =
document.getElementById("total");

const scoreEl =
document.getElementById("score");

const timerEl =
document.getElementById("timer");

const progressEl =
document.getElementById("progress");

const feedbackEl =
document.getElementById("feedback");

const leftChoice =
document.getElementById("leftChoice");

const rightChoice =
document.getElementById("rightChoice");

const revealBtn =
document.getElementById("revealBtn");

const nextBtn =
document.getElementById("nextBtn");

const restartBtn =
document.getElementById("restartBtn");

const finish =
document.getElementById("finish");

const game =
document.getElementById("game");

const overlay =
document.getElementById("overlay");

const count =
document.getElementById("count");

const finalScore =
document.getElementById("finalScore");

const finalMessage =
document.getElementById("finalMessage");

const video =
document.getElementById("video");

const cameraBtn =
document.getElementById("cameraBtn");


/* ======================================
CAMERA
====================================== */

cameraBtn.addEventListener(
  "click",
  async function() {

    try {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Browser tidak mendukung kamera."
        );

      }


      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: true,

          audio: false

        });


      video.srcObject = stream;


      cameraBtn.innerText =
        "✅ KAMERA AKTIF";


      cameraBtn.disabled = true;

    }

    catch (error) {

      alert(
        "Kamera tidak dapat diakses:\n" +
        error.message
      );

    }

  }
);


/* ======================================
AMBIL SOAL DARI SPREADSHEET
====================================== */

function loadQuestions() {

  questionEl.innerText =
    "⏳ Mengambil soal dari Spreadsheet...";


  window.receiveQuestions =
    function(data) {

      questions =
        Array.isArray(data)
          ? data
          : [];


      if (
        questions.length === 0
      ) {

        questionEl.innerText =
          "❌ Bank soal kosong.";

        return;

      }


      // Acak soal

      questions =
        questions.sort(
          () => Math.random() - 0.5
        );


      totalEl.innerText =
        questions.length;


      showQuestion();

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?api=questions" +
    "&callback=receiveQuestions" +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      questionEl.innerHTML =
        "❌ Gagal mengambil soal." +
        "<br><br>" +
        "Periksa izin Web App Apps Script.";

    };


  document.body.appendChild(
    script
  );

}


/* ======================================
SHOW QUESTION
====================================== */

function showQuestion() {

  clearInterval(
    timerInterval
  );


  selectedAnswer =
    null;

  revealed =
    false;


  const q =
    questions[currentIndex];


  numberEl.innerText =
    currentIndex + 1;


  questionEl.innerText =
    q.soal;


  leftChoice.className =
    "choice left";


  rightChoice.className =
    "choice right";


  revealBtn.style.display =
    "inline-block";


  nextBtn.style.display =
    "none";


  feedbackEl.innerHTML =
    "Baca soal dan bersiap untuk <b>JUMP!</b> 🏃";


  mulaiCountdown();

}


/* ======================================
COUNTDOWN
====================================== */

function mulaiCountdown() {

  overlay.style.display =
    "flex";


  let n = 3;


  count.innerText =
    n;


  const interval =
    setInterval(
      function() {

        n--;


        if (n > 0) {

          count.innerText =
            n;

        }


        else {

          clearInterval(
            interval
          );


          count.innerText =
            "JUMP!";


          setTimeout(
            function() {

              overlay.style.display =
                "none";

              mulaiTimer();

            },
            600
          );

        }

      },
      700
    );

}


/* ======================================
TIMER
====================================== */

function mulaiTimer() {

  let t = 5;


  timerEl.innerText =
    t;


  progressEl.style.width =
    "100%";


  timerInterval =
    setInterval(
      function() {

        t -= 0.1;


        const rounded =
          Math.ceil(t);


        timerEl.innerText =
          Math.max(
            0,
            rounded
          );


        progressEl.style.width =
          Math.max(
            0,
            (t / 5) * 100
          ) + "%";


        if (t <= 0) {

          clearInterval(
            timerInterval
          );


          timerEl.innerText =
            "⏰ WAKTU HABIS";


          feedbackEl.innerHTML =
            "Sekarang klik sisi yang dipilih siswa, " +
            "kemudian tekan <b>LIHAT JAWABAN</b>.";

        }

      },
      100
    );

}


/* ======================================
PILIH SISI
====================================== */

leftChoice.addEventListener(
  "click",
  function() {

    if (revealed) return;


    selectedAnswer =
      "SENILAI";


    leftChoice.classList.add(
      "selected"
    );


    rightChoice.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🟢 Pilihan siswa: <b>SENILAI</b><br>" +
      "Tekan <b>LIHAT JAWABAN</b>.";

  }
);


rightChoice.addEventListener(
  "click",
  function() {

    if (revealed) return;


    selectedAnswer =
      "BERBALIK NILAI";


    rightChoice.classList.add(
      "selected"
    );


    leftChoice.classList.remove(
      "selected"
    );


    feedbackEl.innerHTML =
      "🔴 Pilihan siswa: <b>BERBALIK NILAI</b><br>" +
      "Tekan <b>LIHAT JAWABAN</b>.";

  }
);


/* ======================================
REVEAL
====================================== */

revealBtn.addEventListener(
  "click",
  function() {

    if (
      revealed ||
      !selectedAnswer
    ) {

      feedbackEl.innerHTML =
        "⚠️ Pilih sisi yang dipilih siswa dulu.";

      return;

    }


    const q =
      questions[currentIndex];


    revealed = true;


    clearInterval(
      timerInterval
    );


    const benar =
      selectedAnswer ===
      q.jawaban;


    if (benar) {

      score +=
        Number(q.poin) || 10;


      scoreEl.innerText =
        score;


      if (
        selectedAnswer ===
        "SENILAI"
      ) {

        leftChoice.classList.add(
          "correct"
        );

      }

      else {

        rightChoice.classList.add(
          "correct"
        );

      }


      feedbackEl.innerHTML =
        "🎉 <strong>BENAR!</strong><br>" +
        "+" +
        (Number(q.poin) || 10) +
        " poin<br><br>" +
        q.pembahasan;

    }


    else {

      if (
        selectedAnswer ===
        "SENILAI"
      ) {

        leftChoice.classList.add(
          "wrong"
        );

      }

      else {

        rightChoice.classList.add(
          "wrong"
        );

      }


      if (
        q.jawaban ===
        "SENILAI"
      ) {

        leftChoice.classList.add(
          "correct"
        );

      }

      else {

        rightChoice.classList.add(
          "correct"
        );

      }


      feedbackEl.innerHTML =
        "😅 <strong>BELUM TEPAT</strong><br>" +
        "Jawaban benar: <b>" +
        q.jawaban +
        "</b><br><br>" +
        q.pembahasan;

    }


    revealBtn.style.display =
      "none";


    nextBtn.style.display =
      "inline-block";


    // Simpan ke Spreadsheet

    saveResult(
      q,
      selectedAnswer,
      benar
    );

  }
);


/* ======================================
SAVE RESULT
====================================== */

function saveResult(
  q,
  answer,
  benar
) {

  window.saveAck =
    function(result) {

      console.log(
        "Hasil tersimpan:",
        result
      );

    };


  const params =

    "?api=save" +

    "&callback=saveAck" +

    "&pemain=" +
    encodeURIComponent(
      "Kelas VII"
    ) +

    "&id=" +
    encodeURIComponent(
      q.id
    ) +

    "&jawaban=" +
    encodeURIComponent(
      answer
    ) +

    "&jawabanBenar=" +
    encodeURIComponent(
      q.jawaban
    ) +

    "&status=" +
    encodeURIComponent(
      benar
        ? "BENAR"
        : "SALAH"
    ) +

    "&skor=" +
    encodeURIComponent(
      benar
        ? Number(q.poin) || 10
        : 0
    );


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    params +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


/* ======================================
NEXT
====================================== */

nextBtn.addEventListener(
  "click",
  function() {

    currentIndex++;


    if (
      currentIndex >=
      questions.length
    ) {

      finishGame();

      return;

    }


    showQuestion();

  }
);


/* ======================================
FINISH
====================================== */

function finishGame() {

  game.style.display =
    "none";

  finish.style.display =
    "block";


  finalScore.innerText =
    score +
    " POIN";


  const max =
    questions.reduce(
      function(total, q) {

        return total +
          (Number(q.poin) || 10);

      },
      0
    );


  const accuracy =
    max > 0
      ? Math.round(
          score /
          max *
          100
        )
      : 0;


  if (accuracy >= 90) {

    finalMessage.innerText =
      "🏆 RATIO MASTER!";

  }

  else if (accuracy >= 75) {

    finalMessage.innerText =
      "⭐ RATIO EXPERT!";

  }

  else {

    finalMessage.innerText =
      "💪 TERUS BERLATIH!";

  }

}


/* ======================================
RESTART
====================================== */

function restartGame() {

  currentIndex = 0;

  score = 0;

  scoreEl.innerText =
    "0";


  finish.style.display =
    "none";

  game.style.display =
    "block";


  questions =
    questions.sort(
      () => Math.random() - 0.5
    );


  showQuestion();

}


restartBtn.addEventListener(
  "click",
  restartGame
);


document
  .getElementById("restartFinal")
  .addEventListener(
    "click",
    restartGame
  );


/* ======================================
START
====================================== */

loadQuestions();

</script>

</body>

</html>
